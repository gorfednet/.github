# Monthly dependency PRs — copy to each repo as `.github/dependabot.yml`.

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 1
    groups:
      npm:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
          - major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
          - major
