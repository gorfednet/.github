# Monthly dependency PRs — copy to each repo as `.github/dependabot.yml`.
# The `*-security` groups (applies-to: security-updates) make one advisory wave one PR per
# ecosystem. Drop the npm entry for a repository with no package.json.

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 1
    groups:
      npm:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
          - major
      npm-security:
        applies-to: security-updates
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
          - major
      actions-security:
        applies-to: security-updates
        patterns:
          - '*'
