name: verification-kit

# A defect in this kit replicates into every project that copies it, so the
# canonical copy is gated harder than the copies are.

# No `paths:` filter, deliberately. It had one, and the filter is itself a
# selection that fails open: `fleet.json`, `FLEET.md`, `docs/verification-rules.md`
# and `scripts/` were all outside it, so a bad tier claim, a drifted FLEET.md or
# a gap in the rule numbering cited from fifteen repositories could merge
# without ever meeting the check written to catch it. A path filter saves
# seconds on a repository whose whole suite runs in under thirty of them, and
# costs a class of silent miss. The job is cheap; run it on everything.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  kit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Unit and behavioural tests
        run: |
          node --test --test-reporter=spec \
            'templates/verification-kit/test/*.test.mjs'

      # Guards on this repository's own workflows. Every project inherits its
      # CI from one of them, so a gap here is a gap in fifteen places.
      - name: Org workflow guards
        if: ${{ !cancelled() }}
        run: node --test --test-reporter=spec 'test/*.test.mjs'

      - name: Fleet backlog describes reality
        if: ${{ !cancelled() }}
        run: node templates/verification-kit/bin/check-backlog.mjs --file docs/backlog.json

      - name: FLEET.md matches the registry it is generated from
        if: ${{ !cancelled() }}
        run: node scripts/write-fleet-md.mjs --check

      # The fleet registry. The online half needs credentials that can read the
      # other repositories, and `github.token` cannot: it is scoped to this one,
      # so every private sibling answers 404 and — before V39 — that read as
      # "has adopted nothing". Here it runs the schema-and-dates half and says
      # so. The online half runs in fleet-audit.yml, which has the token and
      # fails when it does not.
      - name: Fleet registry is well-formed and no entry has gone stale
        if: ${{ !cancelled() }}
        run: node scripts/check-fleet.mjs --offline

      # Both suites parse YAML by regex, which is fine for asserting a step
      # carries an `if:` and useless for noticing the file stopped being valid
      # YAML. A workflow GitHub cannot parse does not fail — it does not run.
      - name: Every workflow and action still parses as YAML
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          # Installed explicitly rather than assumed. A runner image that stops
          # shipping PyYAML would turn this into an import error, which is at
          # least loud — but "the check could not run" and "the check ran" are
          # states worth keeping apart.
          python3 -m pip install --quiet pyyaml
          count=0
          for file in .github/workflows/*.yml .github/actions/*/action.yml; do
            python3 -c "import sys,yaml; yaml.safe_load(open(sys.argv[1]))" "$file"
            count=$((count + 1))
          done
          echo "parsed $count file(s)"
          if [ "$count" -lt 8 ]; then
            echo "::error::Only $count workflow file(s) parsed; the glob has stopped matching."
            exit 1
          fi

      # The suite above is itself a check, and a glob that stops matching would
      # make it exit 0 having run nothing — the exact failure
      # assert-tests-executed exists to catch. So count its own tests.
      - name: Assert the kit's tests actually ran
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          count=$(node --test --test-reporter=tap \
            'templates/verification-kit/test/*.test.mjs' \
            | grep -c '^ *ok ' || true)
          echo "executed $count assertions"
          if [ "$count" -lt 50 ]; then
            echo "::error::The kit's own suite executed $count tests, expected at least 50." \
                 "A glob that matches nothing exits 0 having proven nothing."
            exit 1
          fi

      # A kit change that merges without a manifest update leaves every
      # consuming project unable to tell a stale copy from a current one — so
      # the distribution mechanism would fail exactly the way the kit is meant
      # to prevent.
      - name: MANIFEST.json describes the kit as committed
        if: ${{ !cancelled() }}
        run: node templates/verification-kit/bin/write-manifest.mjs --check

      # Every guard above is an assumption until it has been watched failing.
      - name: Canaries — prove each guard can fail
        if: ${{ !cancelled() }}
        run: |
          node templates/verification-kit/bin/mutation-canary.mjs \
            --file canaries.json

      # This step used to require the opposite, and the requirement was wrong:
      # a template that satisfies its own gate is one a project can copy,
      # never edit, and get a green check describing a bug nobody has (V52).
      #
      # So the template must be structurally valid — it is still parsed, and
      # every other rule still applies to it — and must be rejected for being
      # the placeholder. The unit tests cover the first half; this covers the
      # second, and would notice if the two ever drifted apart.
      - name: The template backlog must be rejected for being the template
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          output=$(node templates/verification-kit/bin/check-backlog.mjs \
            --file templates/verification-kit/templates/backlog.json 2>&1) && status=0 || status=$?
          echo "$output"
          if [ "$status" -eq 0 ]; then
            echo "::error::The shipped template passes its own validator. A project" \
                 "that copies it and never edits it would get a green backlog check" \
                 "for a bug nobody has."
            exit 1
          fi
          if ! grep -q "still the template's example" <<<"$output"; then
            echo "::error::The template was rejected, but not for being the template." \
                 "That is a different failure and it is hiding this check."
            exit 1
          fi

      - name: No generated files tracked in this repo either
        if: ${{ !cancelled() }}
        run: node templates/verification-kit/bin/check-tracked-artifacts.mjs

      # The shared rules are cited from fifteen repositories, so a gap or a
      # duplicate here dangles someone else's code comment.
      - name: Shared rule sequence is gapless and every citation resolves
        if: ${{ !cancelled() }}
        run: |
          node templates/verification-kit/bin/check-rule-citations.mjs \
            --source templates --source scripts --source test
