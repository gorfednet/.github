name: verification-kit

# A defect in this kit replicates into every project that copies it, so the
# canonical copy is gated harder than the copies are.

on:
  pull_request:
    paths:
      - 'templates/verification-kit/**'
      - 'test/**'
      - '.github/**'
  push:
    branches: [main]
    paths:
      - 'templates/verification-kit/**'
      - 'test/**'
      - '.github/**'

jobs:
  kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Unit and behavioural tests
        run: |
          node --test --test-reporter=spec \
            'templates/verification-kit/test/*.test.mjs'

      # Guards on this repository's own workflows. Every project inherits its
      # CI from one of them, so a gap here is a gap in fifteen places.
      - name: Org workflow guards
        if: ${{ !cancelled() }}
        run: node --test --test-reporter=spec 'test/*.test.mjs'

      # The fleet registry, asked of the repositories rather than taken at its
      # word. Needs a token, so it degrades to the schema-and-dates half on a
      # fork PR — loudly, via the flag's own output.
      - name: Fleet registry describes reality
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event.pull_request.head.repo.fork }}" = "true" ]; then
            node scripts/check-fleet.mjs --offline
          else
            node scripts/check-fleet.mjs
          fi

      # Both suites parse YAML by regex, which is fine for asserting a step
      # carries an `if:` and useless for noticing the file stopped being valid
      # YAML. A workflow GitHub cannot parse does not fail — it does not run.
      - name: Every workflow and action still parses as YAML
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          # Installed explicitly rather than assumed. A runner image that stops
          # shipping PyYAML would turn this into an import error, which is at
          # least loud — but "the check could not run" and "the check ran" are
          # states worth keeping apart.
          python3 -m pip install --quiet pyyaml
          count=0
          for file in .github/workflows/*.yml .github/actions/*/action.yml; do
            python3 -c "import sys,yaml; yaml.safe_load(open(sys.argv[1]))" "$file"
            count=$((count + 1))
          done
          echo "parsed $count file(s)"
          if [ "$count" -lt 8 ]; then
            echo "::error::Only $count workflow file(s) parsed; the glob has stopped matching."
            exit 1
          fi

      # The suite above is itself a check, and a glob that stops matching would
      # make it exit 0 having run nothing — the exact failure
      # assert-tests-executed exists to catch. So count its own tests.
      - name: Assert the kit's tests actually ran
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          count=$(node --test --test-reporter=tap \
            'templates/verification-kit/test/*.test.mjs' \
            | grep -c '^ *ok ' || true)
          echo "executed $count assertions"
          if [ "$count" -lt 50 ]; then
            echo "::error::The kit's own suite executed $count tests, expected at least 50." \
                 "A glob that matches nothing exits 0 having proven nothing."
            exit 1
          fi

      # A kit change that merges without a manifest update leaves every
      # consuming project unable to tell a stale copy from a current one — so
      # the distribution mechanism would fail exactly the way the kit is meant
      # to prevent.
      - name: MANIFEST.json describes the kit as committed
        if: ${{ !cancelled() }}
        run: node templates/verification-kit/bin/write-manifest.mjs --check

      # Every guard above is an assumption until it has been watched failing.
      - name: Canaries — prove each guard can fail
        if: ${{ !cancelled() }}
        run: |
          node templates/verification-kit/bin/mutation-canary.mjs \
            --file templates/verification-kit/canaries.json

      - name: The template backlog must satisfy the validator it ships with
        if: ${{ !cancelled() }}
        run: |
          node templates/verification-kit/bin/check-backlog.mjs \
            --file templates/verification-kit/templates/backlog.json

      - name: No generated files tracked in this repo either
        if: ${{ !cancelled() }}
        run: node templates/verification-kit/bin/check-tracked-artifacts.mjs

      # The shared rules are cited from fifteen repositories, so a gap or a
      # duplicate here dangles someone else's code comment.
      - name: Shared rule sequence is gapless and every citation resolves
        if: ${{ !cancelled() }}
        run: |
          node templates/verification-kit/bin/check-rule-citations.mjs \
            --source templates --source scripts --source test
