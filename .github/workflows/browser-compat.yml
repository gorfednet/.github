name: browser-compat

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version
        required: false
        type: string
        default: "22"
      build-command:
        description: Build command before Playwright
        required: false
        type: string
        default: npm run build
      preview-command:
        description: Preview server command (background)
        required: false
        type: string
        default: ""
      playwright-test-command:
        description: Playwright test command
        required: false
        type: string
        default: npx playwright test e2e/smoke.spec.ts

jobs:
  compat:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: gorfednet/.github/.github/actions/setup-node@main
        with:
          node-version: ${{ inputs.node-version }}
      - name: Build
        run: ${{ inputs.build-command }}
      - uses: gorfednet/.github/.github/actions/setup-playwright@main
      - name: Playwright smoke (${{ matrix.browser }})
        run: ${{ inputs.playwright-test-command }} --project=${{ matrix.browser }}
        env:
          CI: true
          PLAYWRIGHT_WORKERS: 1

  compat-success:
    runs-on: ubuntu-latest
    needs: compat
    if: always()
    steps:
      - name: Require all browser jobs
        run: |
          if [[ "${{ needs.compat.result }}" != "success" ]]; then
            echo "Browser compatibility matrix failed"
            exit 1
          fi
          echo "All browsers passed"
