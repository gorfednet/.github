name: browser-compat

on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          Where every job runs, as JSON: a label string or an array of labels, e.g.
          '["self-hosted","linux","4c-heavy"]'. Optional: left empty, the caller's HEAVY_RUNS_ON
          variable is used, so no caller has to pass it. A public caller always runs
          GitHub-hosted, which is free (owner, 2026-11-20: free runners only), whatever this input
          or the variable say: the pool serves no public repository. A scheduled run's event carries no
          repository, so that rule can't see one: a public caller on a schedule passes a hosted runs-on
          itself. With neither set, a private one asks for a label no runner carries and waits, spending no paid minutes.
        required: false
        type: string
        default: ""
      node-version:
        description: Node.js version
        required: false
        type: string
        default: "22"
      build-command:
        description: Build command before Playwright
        required: false
        type: string
        default: npm run build
      preview-command:
        description: Preview server command (background)
        required: false
        type: string
        default: ""
      playwright-test-command:
        description: >-
          Playwright test command. Defaults to the whole suite.

          It used to default to `npx playwright test e2e/smoke.spec.ts`, which
          names one file and silently runs only that. gorfmusic.com inherited
          it with two spec files, so its entire accessibility suite — axe
          scans, skip link, keyboard focus, form control contrast — had never
          run in CI, and the job was green throughout, because a selection that
          matches less than you think still passes what it matched.

          (An earlier version of this note also named 4thcltr.com and its
          twenty-four specs. That was wrong: it does not call this workflow at
          all, it runs its own sharded e2e job. Left corrected rather than
          deleted, because a rule justified by an example that does not hold is
          worse than one with no example.)

          Narrow it deliberately if you must, and pair it with min-tests so the
          narrowing is visible.
        required: false
        type: string
        default: npx playwright test
      min-tests:
        description: >-
          Executed-test floor per browser. Set it to what the job runs today,
          minus nothing: a floor comfortably under the real count tolerates
          exactly the decay it exists to catch. The default of 1 only rules
          out the empty run.
        required: false
        type: string
        default: "1"
      verification-kit:
        description: >-
          Path to the vendored kit, used for the executed-count assertion.
          Empty falls back to an inline count, which is weaker but still
          refuses an empty run.
        required: false
        type: string
        default: ""
      system-deps:
        description: >-
          "always" (default) installs browsers with `--with-deps`, as before. "auto" skips apt on
          a hosted runner when each browser already launches, and runs `install-deps` only for
          those that do not (setup-playwright). `--with-deps` also installs fonts, so "auto" can
          change text rendering: keep "always" where the specs compare screenshots, snapshots or
          text widths. Any other value fails the job. Ignored on the self-hosted pool.
        required: false
        type: string
        default: always
      webkit-shards:
        description: >-
          How many Playwright shards to split webkit into, "1" to "8". "1" (default) is the
          unsharded matrix: three jobs named `compat (chromium)`, `compat (firefox)` and
          `compat (webkit)`, as before. Above 1, only webkit splits, into jobs named
          `compat (webkit 1 of N)` ... `compat (webkit N of N)`, each running
          `--shard=i/N` with one worker. Chromium and firefox never shard. Each shard must run
          at least one test, and min-tests then applies to the sum across the shards, never
          divided. A caller that opts in must update its required checks: `compat (webkit)`
          no longer exists.
        required: false
        type: string
        default: "1"

jobs:
  # Emits the matrix. A bad webkit-shards value fails here, and compat is then skipped, which
  # compat-success reports as red.
  plan:
    runs-on: ${{ fromJSON(github.event.repository.visibility == 'public' && '"ubuntu-latest"' || inputs.runs-on != '' && inputs.runs-on || vars.HEAVY_RUNS_ON != '' && vars.HEAVY_RUNS_ON || '["self-hosted","no-pool-label-set"]') }}
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      # Plain setup-node: no checkout here, so no package-lock.json to cache on or `npm ci`.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ inputs.node-version }}
      - id: plan
        uses: gorfednet/.github/.github/actions/browser-compat-plan@main
        with:
          webkit-shards: ${{ inputs.webkit-shards }}

  compat:
    name: compat (${{ matrix.label }})
    needs: plan
    runs-on: ${{ fromJSON(github.event.repository.visibility == 'public' && '"ubuntu-latest"' || inputs.runs-on != '' && inputs.runs-on || vars.HEAVY_RUNS_ON != '' && vars.HEAVY_RUNS_ON || '["self-hosted","no-pool-label-set"]') }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: gorfednet/.github/.github/actions/setup-node@main
        with:
          node-version: ${{ inputs.node-version }}
      - name: Build
        run: ${{ inputs.build-command }}
      # One browser per job. The action's default installs all three, so every matrix
      # job paid for chromium, firefox and webkit on a cache miss, and every Playwright
      # bump is a miss: ssatcy.com#18 and gorfed.net#57 lost their chromium jobs to the
      # 25-minute limit inside this step (2026-10-01). The cache key already carries the
      # browser slug, so each browser caches on its own.
      - uses: gorfednet/.github/.github/actions/setup-playwright@main
        with:
          browsers: ${{ matrix.browser }}
          system-deps: ${{ inputs.system-deps }}
      - name: Playwright smoke (${{ matrix.label }})
        run: >-
          ${{ inputs.playwright-test-command }} --project=${{ matrix.browser }}
          ${{ matrix.shard_arg }} --reporter=list,json
        env:
          CI: true
          PLAYWRIGHT_WORKERS: 1
          # Off stdout, so `list` still prints something a person can read when
          # a browser fails. A report only a machine sees is no use at 2am.
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ matrix.report }}

      # A failing browser job must leave its evidence behind: traces, screenshots and
      # error context under test-results/. Without this, a Linux-only failure can only
      # be guessed at (promptboi.com#44, 2026-10-11).
      - name: Upload Playwright test results
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-${{ matrix.label }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      # Three browsers, and until now nothing checked that any of them ran a
      # test. The spec selection is a command string supplied by the caller, so
      # a path that stops matching produces three green jobs in about forty
      # seconds — and cross-browser coverage is exactly the kind that nobody
      # reproduces by hand before shipping.
      # A sharded entry asserts at least 1 here (a shard that ran nothing fails); the floor
      # itself is held on the sum in compat-success. An unsharded entry asserts min-tests.
      - name: Assert ${{ matrix.label }} actually ran the specs
        if: ${{ !cancelled() }}
        env:
          MIN_HERE: ${{ matrix.shards != '' && '1' || inputs.min-tests }}
        run: |
          set -euo pipefail
          report="${{ matrix.report }}"
          if [ -n "${{ inputs.verification-kit }}" ]; then
            node "${{ inputs.verification-kit }}/bin/assert-tests-executed.mjs" \
              --report "$report" --min "$MIN_HERE" \
              --label "compat ${{ matrix.label }}"
          else
            # Non-skipped results, not specs: a fully skipped suite is the
            # condition this exists to catch, and counting specs would pass it.
            count=$(node -e "
              const r = require('./$report');
              const walk = (s) => s.reduce((n, x) =>
                n
                + (x.specs ?? []).reduce((m, spec) =>
                    m + (spec.tests ?? []).filter((t) => t.status !== 'skipped').length, 0)
                + walk(x.suites ?? []), 0);
              console.log(walk(r.suites ?? []));
            ")
            echo "${{ matrix.label }} executed $count test(s)"
            if [ "$count" -lt "$MIN_HERE" ]; then
              echo "::error::${{ matrix.label }} executed $count test(s)," \
                   "expected at least $MIN_HERE. A selection that" \
                   "matches nothing exits 0 having proven nothing."
              exit 1
            fi
          fi

      # Sharded entries only: their reports go to compat-success, which sums them.
      - name: Upload shard report
        if: ${{ !cancelled() && matrix.shards != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: compat-report-${{ matrix.report }}
          overwrite: true
          path: ${{ matrix.report }}
          if-no-files-found: error
          retention-days: 7

  compat-success:
    runs-on: ${{ fromJSON(github.event.repository.visibility == 'public' && '"ubuntu-latest"' || inputs.runs-on != '' && inputs.runs-on || vars.HEAVY_RUNS_ON != '' && vars.HEAVY_RUNS_ON || '["self-hosted","no-pool-label-set"]') }}
    timeout-minutes: 5
    needs: [plan, compat]
    if: always()
    steps:
      - name: Require all browser jobs
        run: |
          if [[ "${{ needs.plan.result }}" != "success" || "${{ needs.compat.result }}" != "success" ]]; then
            echo "Browser compatibility matrix failed (plan: ${{ needs.plan.result }}, compat: ${{ needs.compat.result }})"
            exit 1
          fi
          echo "All browsers passed"

      # Sharded browsers: every shard's report must be here, and their sum must meet the
      # floor. Fails closed on a missing report. No-op when webkit-shards is 1.
      - name: Download shard reports
        if: ${{ !cancelled() && inputs.webkit-shards != '1' && needs.plan.result == 'success' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: compat-report-*
          merge-multiple: true
          path: shard-reports
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: ${{ !cancelled() && inputs.webkit-shards != '1' && needs.plan.result == 'success' }}
        with:
          node-version: ${{ inputs.node-version }}
      - name: Sum sharded executed tests against the floor
        if: ${{ !cancelled() && inputs.webkit-shards != '1' && needs.plan.result == 'success' }}
        uses: gorfednet/.github/.github/actions/browser-compat-rollup@main
        with:
          matrix: ${{ needs.plan.outputs.matrix }}
          report-dir: shard-reports
          min-tests: ${{ inputs.min-tests }}
