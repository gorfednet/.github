# Pull request review by Claude, shared by every repository (ported from bindercurve.com's
# claude-review.yml; it replaced Cursor Bugbot, which was retired on 2026-10-16).
#
# A repository calls this from its own .github/workflows/claude-review.yml (templates/claude-review.yml)
# on `pull_request: [opened, ready_for_review]` and `issue_comment: [created]`. The job reviews when a
# pull request opens or leaves draft, and again whenever an owner, member or collaborator posts a
# comment with a line that is exactly "claude review" (any case; other lines may explain): once at open, once more on the final head after a push that changed code someone
# wrote, which keeps reviews inside the Max plan's limits.
#
# A pull request Dependabot opens is not reviewed on `pull_request` (7 November 2026): GitHub runs
# that event for dependabot[bot] with read-only secrets, so the review job could not read
# CLAUDE_CODE_OAUTH_TOKEN and failed on every Dependabot pull request fleet-wide. A `claude review`
# comment from an owner, member or collaborator still reviews one (the `issue_comment` path is
# unchanged, and that event carries the secret).
#
# It authenticates with whatever the caller passes as CLAUDE_CODE_OAUTH_TOKEN: the owner's Claude
# subscription token (from `claude setup-token`, `sk-ant-oat...`) or an Anthropic API key
# (`sk-ant-api...`) with its own spending cap. The "Pick the credential" step tells them apart by
# prefix, so a repository switches by replacing the secret's value, with no caller change. An API
# key keeps reviews off the subscription's weekly limit (owner, 2026-10-27: the shared limit was
# reached and every review failed).
#
# Both jobs run on the caller's pool: the optional `runs-on` input (JSON), else the caller's
# HEAVY_RUNS_ON variable. The owner's instruction of 2026-11-20 ("we need to stop using github
# runners entirely, only rely on local infra") replaces the decision of 2026-10-19 that kept
# secret-holding jobs hosted. A public caller always runs GitHub-hosted, which is free (owner,
# 2026-11-20: free runners only), whatever the input or the variable say: the pool serves no public
# repository. With neither set, a private caller waits for a label no
# runner carries, so it gets no review until it has a served one. Paid minutes are never used.
#
# A pull request whose head is in another repository (a fork) is never reviewed here, on either
# trigger: the review job holds the token and runs on the pool, and a fork's head must not reach it.
#
# The verdict is machine-readable: the review ends with one pull request comment carrying
# `<!-- claude-review head=<sha> findings=<n> blocking=<m> -->`, which scripts/review-status.mjs (in this
# repository) reads for the merge gate. The repository's REVIEW.md holds its house rules.
name: claude-review

on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          Where every job runs, as JSON: a label string or an array of labels, e.g.
          '["self-hosted","linux","4c-heavy"]'. Optional: left empty, the caller's HEAVY_RUNS_ON
          variable is used, so no caller has to pass it. A public caller always runs
          GitHub-hosted, which is free (owner, 2026-11-20: free runners only), whatever this input
          or the variable say: the pool serves no public repository. A scheduled run's event carries no
          repository, so that rule can't see one: a public caller on a schedule passes a hosted runs-on
          itself. With neither set, a private one asks for a label no runner carries and waits, spending no paid minutes.
        required: false
        type: string
        default: ""
      model:
        description: >-
          Claude model that reviews. "auto" (the default) means Opus, except that the "Pick the
          model" step reviews the small sites (the repositories it lists) with Sonnet, so one
          place sets the model for 19 callers (owner, 2026-10-30, token efficiency). Any other
          value, claude-opus-5-5 included, is used exactly as passed.
        required: false
        type: string
        default: auto
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  # Is this a review request? Its own job, with no concurrency group: the review job below holds
  # `claude-review-<repo>-<pr>`, where a newer pending run replaces an older queued one, so a
  # comment that only mentions the words must never reach it (a prose mention would otherwise
  # cancel a real request queued behind a running review).
  # Ship-bot asks for a draft's review by commenting `claude review`. As a GitHub App it posts
  # as `<slug>[bot]`, type Bot, association NONE, so the org variable SHIP_BOT_LOGIN names that
  # login (set it to `<slug>[bot]` once the App exists; unset, nothing matches). No other bot
  # can start a review.
  trigger:
    if: >-
      (github.event_name == 'pull_request' && !github.event.pull_request.draft &&
       github.event.pull_request.user.login != 'dependabot[bot]' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       contains(github.event.comment.body, 'claude review') &&
       ((github.event.comment.user.type != 'Bot' &&
         contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (vars.SHIP_BOT_LOGIN != '' && github.event.comment.user.login == vars.SHIP_BOT_LOGIN)))
    runs-on: ${{ fromJSON(github.event.repository.visibility == 'public' && '"ubuntu-latest"' || inputs.runs-on != '' && inputs.runs-on || vars.HEAVY_RUNS_ON != '' && vars.HEAVY_RUNS_ON || '["self-hosted","no-pool-label-set"]') }}
    timeout-minutes: 2
    permissions:
      pull-requests: read
    outputs:
      go: ${{ steps.fork.outputs.go || steps.trigger.outputs.go }}
    steps:
      # The job's `if` only prefilters a comment (the words appear somewhere, and contains() is
      # case-insensitive). This decides: a review is asked for when one line of the comment,
      # trimmed, is exactly "claude review", in any case. Until 2026-10-21 the comment had to
      # START with it, so a session that explained a push and put the request on the last line got
      # no review and the pull request waited all night (MoonMan #283, #292). A phrase inside a
      # sentence ("please don't claude review yet") is not a request.
      - name: Is this a review request?
        id: trigger
        env:
          EVENT: ${{ github.event_name }}
          BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          go=true
          if [[ "$EVENT" == issue_comment ]]; then
            go=false
            while IFS= read -r line || [[ -n "$line" ]]; do
              line="$(printf '%s' "${line%$'\r'}" | tr '[:upper:]' '[:lower:]' | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//')"
              if [[ "$line" == "claude review" ]]; then go=true; fi
            done <<<"$BODY"
          fi
          echo "go=${go}" >> "$GITHUB_OUTPUT"
          echo "review requested: ${go}"

      # A fork head never reaches the review job. The pull_request payload carries the head
      # repository; an issue_comment payload does not, so it is read from the API. A failed read
      # fails the job. A deleted head repository is refused, never assumed to be this one.
      - name: Refuse a pull request from a fork
        id: fork
        if: steps.trigger.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BASE_REPO: ${{ github.repository }}
          PAYLOAD_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          set -euo pipefail
          head="$PAYLOAD_HEAD_REPO"
          if [[ "$EVENT" == issue_comment ]]; then
            # A failed read is red, never a silent skip: only a fork, or a deleted head
            # repository (an empty name), skips the review.
            if ! head="$(gh api "repos/${BASE_REPO}/pulls/${NUMBER}" --jq '.head.repo.full_name // ""')"; then
              echo "::error::Could not read pull request ${NUMBER} to check its head repository."
              exit 1
            fi
          fi
          go=false
          if [[ -n "$head" && "$head" == "$BASE_REPO" ]]; then go=true; fi
          echo "go=${go}" >> "$GITHUB_OUTPUT"
          echo "head repository: ${head:-unknown}; review: ${go}"

  review:
    needs: trigger
    if: needs.trigger.outputs.go == 'true'
    runs-on: ${{ fromJSON(github.event.repository.visibility == 'public' && '"ubuntu-latest"' || inputs.runs-on != '' && inputs.runs-on || vars.HEAVY_RUNS_ON != '' && vars.HEAVY_RUNS_ON || '["self-hosted","no-pool-label-set"]') }}
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    concurrency:
      group: claude-review-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - name: Resolve the pull request head
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          set -euo pipefail
          pull="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${NUMBER}" --jq '.head.sha + " " + .base.sha')"
          echo "number=${NUMBER}" >> "$GITHUB_OUTPUT"
          echo "head=${pull%% *}" >> "$GITHUB_OUTPUT"
          echo "base=${pull##* }" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.pr.outputs.head }}
          fetch-depth: 0

      # From gorfednet/.github@main, never from the checkout: see the action's description.
      - name: Build the review input
        uses: gorfednet/.github/.github/actions/review-input@main
        with:
          base: ${{ steps.pr.outputs.base }}
          head: ${{ steps.pr.outputs.head }}
          out: review-input

      # One place for the model. The small sites get Sonnet; 4thcltr.com, heuristics, papers,
      # gorfed.net, bindercurve.com, assess and ops keep Opus under "auto". Matching is by
      # repository name, case-insensitive (ACID2REAPER's remote is spelled in capitals).
      - name: Pick the model
        id: model
        env:
          REPO: ${{ github.repository }}
          REQUESTED: ${{ inputs.model }}
        run: |
          set -euo pipefail
          model="${REQUESTED:-auto}"
          if [[ "$model" == auto ]]; then
            model=claude-opus-5-5
            repo="$(printf '%s' "${REPO#*/}" | tr '[:upper:]' '[:lower:]')"
            case "$repo" in
              promptboi.com|denseware.com|ssatcy.com|gorfmusic.com|subrythm.com|blackpixelrecords.com|anal0g.org|rowanmcarthur.com|acid2reaper) model=claude-sonnet-5-5 ;;
            esac
          fi
          echo "model=${model}" >> "$GITHUB_OUTPUT"
          echo "reviewing ${REPO} with ${model}"

      # The secret holds either a subscription token or an API key; pass it to the matching input.
      # Fails closed: an empty or unrecognised value is an error, never a silent skip.
      - name: Pick the credential
        id: auth
        env:
          CREDENTIAL: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          case "$CREDENTIAL" in
            sk-ant-api*|sk-ant-usr*) echo "kind=api" >> "$GITHUB_OUTPUT" ;;
            sk-ant-oat*) echo "kind=oauth" >> "$GITHUB_OUTPUT" ;;
            "") echo "::error::CLAUDE_CODE_OAUTH_TOKEN is empty: set it to a subscription token or an Anthropic API key"; exit 1 ;;
            *) echo "::error::CLAUDE_CODE_OAUTH_TOKEN is neither a subscription token (sk-ant-oat...) nor an API key (sk-ant-api... or sk-ant-usr...)"; exit 1 ;;
          esac

      - name: Review
        uses: anthropics/claude-code-action@f3b070c88125d33dbae5653df5f143101d4ea9dc # v1.0.276
        with:
          anthropic_api_key: ${{ steps.auth.outputs.kind == 'api' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          claude_code_oauth_token: ${{ steps.auth.outputs.kind == 'oauth' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          github_token: ${{ github.token }}
          # The action refuses any non-human actor unless it is listed here. Ship-bot readies a
          # draft, and a `ready_for_review` run then has the ship-bot App as its actor (ops 105,
          # 15 November 2026). Exactly that one login, never `*`: any other bot is still refused.
          # The trigger job above decides which events reach this step; this only lets the
          # action's own actor check agree with it.
          allowed_bots: gorfednet-ship-bot
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ steps.pr.outputs.number }}
            HEAD SHA: ${{ steps.pr.outputs.head }}

            Review this pull request for real defects. House rules are in REVIEW.md and CLAUDE.md
            at the repository root, where they exist; hold the change to them.

            Do not use `gh pr diff`: GitHub refuses it past 300 files. The diff is already built in
            `review-input/`. Read `review-input/README.txt` first; its first line says
            `MODE: ordinary` or `MODE: train`.

            - Ordinary pull request: review `review-input/full.diff` line by line.
            - Release train (one branch that merges several separately reviewed pull requests):
              the carried pull requests were reviewed on their own, so the verdict covers the code
              written on the train. Review `review-input/merges.diff` (what each conflict
              resolution changed relative to git's automatic merge) and `review-input/own.diff`
              (the commits written on the train itself) line by line. Use `review-input/full.diff`,
              `git show` and `git log` only to check context. If you could not read all of what
              you were told to review, say so in the closing comment.

            What to report: real defects in the lines this pull request changes, or defects those
            lines cause elsewhere.
            - Wrong behaviour: logic errors, races, an unreachable branch, a swallowed error, a
              value that can be null where the code assumes it is not.
            - Data loss or corruption: a write that overwrites what another writer wrote; a
              migration that is not re-runnable or deletes more than it says.
            - Security: authorization gaps, secrets in code or logs, input that reaches SQL, a
              shell or a prompt unchecked, a check that fails open.
            - Tests and gates that cannot fail: an assertion that passes whether or not the change
              works, a skipped or empty suite reported as green, a filter that matches nothing, a
              CI step that an earlier failure silently switches off.
            - Production breakage: a dependency, environment variable or deploy step the
              production path does not have.
            - Copy that no longer matches behaviour: a change to what a feature does, stores or
              measures, without the help, legal or privacy text that describes it.

            Do not report style, naming, formatting or comment wording unless it hides a defect,
            lockfile-only churn unless a dependency change looks unsafe, or anything outside the
            diff that the pull request does not affect. Never suggest weakening a check, raising a
            ratchet, widening a tolerance, skipping a test or enabling auto-merge to go green.

            Read whatever surrounding code you need to be sure a finding is real; a finding you
            have not traced to a concrete failure is not a finding.

            Leave one inline comment per finding on the changed line, starting with High, Medium or
            Low, saying what goes wrong, for whom, and how to see it. Name the fix only when it is
            clear.

            Finish with exactly one top-level comment on the pull request (`gh pr comment`), whether
            or not you found anything: one or two sentences saying what you reviewed and what you
            found, then this line exactly, with the number of inline comments you left (N) and how
            many of them start with High or Medium (M; Low-only gives 0):
            <!-- claude-review head=${{ steps.pr.outputs.head }} findings=N blocking=M -->
          claude_args: |
            --model ${{ steps.model.outputs.model }}
            --permission-mode default
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr view:*),Bash(git show:*),Bash(git log:*),Bash(git diff:*),Read,Grep,Glob"
