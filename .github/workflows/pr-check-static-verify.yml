name: pr-check-static-verify

on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          Where every job runs, as JSON: a label string or an array of labels, e.g.
          '["self-hosted","linux","4c-heavy"]'. Optional: left empty, the caller's HEAVY_RUNS_ON
          variable is used, so no caller has to pass it. A public caller always runs
          GitHub-hosted, which is free (owner, 2026-11-20: free runners only), whatever this input
          or the variable say: the pool serves no public repository. A scheduled run's event carries no
          repository, so that rule can't see one: a public caller on a schedule passes a hosted runs-on
          itself. A private caller with neither set, or with a hosted name, fails at once with a message that names the fix; no job queues.
        required: false
        type: string
        default: ""
      node-version:
        description: Node.js version
        required: false
        type: string
        default: "22"
      python-version:
        description: Python version
        required: false
        type: string
        default: "3.x"
      build-command:
        description: Optional build command before verify
        required: false
        type: string
        default: ""
      python-verify-command:
        description: Python verification command
        required: false
        type: string
        default: ""
      node-verify-command:
        description: Node verification command
        required: false
        type: string
        default: ""
      make-test-command:
        description: Optional make test or similar
        required: false
        type: string
        default: ""
      run-audit-gate:
        description: Run npm audit gate when package-lock.json exists
        required: false
        type: boolean
        default: true

      verification-kit:
        description: >-
          Path to the vendored verification kit. Empty disables the gate.
          The default is empty on purpose: all fourteen projects already
          inherit these workflows, so a non-empty default would have turned
          every one of them red on the day the gate landed, and a fleet-wide
          red is indistinguishable from a fleet-wide outage. Adoption is
          opt-in and per project; FLEET.md is what stops "not yet" becoming
          permanent.
        required: false
        type: string
        default: ""
      verification-backlog:
        description: Path to the project's backlog. Empty skips that check.
        required: false
        type: string
        default: docs/backlog.json
      test-report:
        description: Playwright or Vitest JSON report to assert a floor against.
        required: false
        type: string
        default: ""
      min-tests:
        description: Executed-test floor. Set it to what the job runs today.
        required: false
        type: string
        default: "1"
      rule-sources:
        description: >-
          Space-separated roots to scan for rule citations. Defaults to the
          whole tree, which is right until a project vendors third-party code:
          towit.io ships a bundled AngularJS whose wrapped lines read as a
          citation of a rule numbered zero, which no editing of a third-party
          library can fix.

          The gate action has always had this input. No caller exposed it, so
          no project could set it — an input nothing can reach is the same as
          no input at all (rule V54).
        required: false
        type: string
        default: "."
      source-dirs:
        description: >-
          Space-separated directories that look generated but hold hand-written
          code here. `build/` is output nearly everywhere and is where
          gorfed.net keeps its Python build scripts, so the kit's list cannot
          simply drop it. Each one is printed on every run.
        required: false
        type: string
        default: ""
      site-url:
        description: >-
          Production base URL, no trailing slash. Required by the metadata and
          og:image checks, which have to know what "on this site" means before they
          can tell an absolute local URL from a third-party hotlink. Empty skips
          both, which is right only for a project that ships no HTML.
        required: false
        type: string
        default: ""
      metadata-pages:
        description: >-
          Space-separated HTML files to check, one per route the site actually
          serves — not just the homepage.

          ssatcy.com is why this is a list. It builds one shell for seven routes, so
          six of its pages emitted the homepage's canonical and could not rank,
          while every homepage-level check in the fleet passed. A representative
          page is not a sample of a per-page property; it is the page that works.
        required: false
        type: string
        default: ""
      publish-root:
        description: >-
          Directory the site's URL paths resolve against on disk, so an og:image URL
          can be turned back into bytes to open. Usually `dist` or `public`.
        required: false
        type: string
        default: ""
      og-max-bytes:
        description: >-
          Ceiling for the social card image. denseware.com pointed og:image at a
          3840x4557 background weighing 2.1 MB; some scrapers give up first.
        required: false
        type: string
        default: "300000"
      require-jsonld:
        description: >-
          When "true", every checked page must carry a JSON-LD block. Off by
          default because a Tier 1 holding page has nothing to describe.
        required: false
        type: string
        default: "false"
      error-page-root:
        description: >-
          Directory that should contain 404.html and 500.html. Empty skips the
          check. This is only the repository half — the server half is the live
          probe in production-healthcheck, because a 404.html nginx was never told
          to serve is exactly as useful as no file (V66).
        required: false
        type: string
        default: ""
      error-page-markers:
        description: >-
          Space-separated strings from this site's own design that must appear in
          each error page. Without one, "the file exists" is the whole assertion,
          and a placeholder added to turn a check green satisfies it.
        required: false
        type: string
        default: ""
      allow-machine-paths:
        description: >-
          Space-separated substrings waiving a deliberate absolute path from
          check-machine-paths (V73). The waiver belongs in the caller's config
          rather than as a marker inside the file it excuses, so that auditing
          what a repository is allowed to hardcode does not require a grep.
        required: false
        type: string
        default: ""
      fail-on-build-edits:
        description: >-
          When "true", a step right after the build fails if the build changed any tracked
          file (`git diff --exit-code`). A build that rewrites its own inputs makes every later
          step depend on local history (gorfmusic PR 24: CI's libvips named a card differently,
          the generator rewrote siteMeta.ts, and the canary guarding that file refused to run).
          Off by default: six repositories hashed rendered output, and a default of true would
          have turned them red together. Turn it on per repository once its build is clean.
        required: false
        type: string
        default: "false"
      timeout-minutes:
        description: >-
          Minutes before the check job is cancelled. Default 20; raise it for a repository whose
          build runs long on a slow runner.
        required: false
        type: number
        default: 20
      og-content-addressed:
        description: >-
          When "true", the social card's file name must carry a content hash
          (og-card-<hash12>.png). The host serves images immutable for a year, so
          a card replaced at a fixed name reaches nobody.
        required: false
        type: string
        default: "false"
      sitemap-origin:
        description: >-
          Production base URL the sitemap lists, no trailing slash. Opts the
          site in to check-sitemap-pages (V77) against publish-root. Empty
          skips it; turn it on per site once the site is clean.
        required: false
        type: string
        default: ""
      sitemap-files:
        description: >-
          Space-separated sitemap files under publish-root (repeated
          --sitemap). Empty uses sitemap.xml.
        required: false
        type: string
        default: ""
      sitemap-allow-thin:
        description: >-
          Space-separated URL paths allowed to be shorter than the word floor
          (repeated --allow-thin). Write the reason beside the value.
        required: false
        type: string
        default: ""
      sitemap-min-words:
        description: >-
          Visible-word floor for a listed page. Empty uses the checker's 150.
        required: false
        type: string
        default: ""
      privacy-date-config:
        description: >-
          Path to the site's privacy-date config (JSON). Opts the site in to
          check-privacy-date (V78): the privacy page's shown date moves with its
          policy text and only then. Empty skips it.
        required: false
        type: string
        default: ""
jobs:
  check:
    runs-on: ${{ fromJSON(github.event.repository.visibility == 'public' && '"ubuntu-latest"' || inputs.runs-on == '' && vars.HEAVY_RUNS_ON == '' && 'no pool for this repository - set HEAVY_RUNS_ON' || github.event.repository.visibility != '' && (contains(inputs.runs-on != '' && inputs.runs-on || vars.HEAVY_RUNS_ON, 'ubuntu-') || contains(inputs.runs-on != '' && inputs.runs-on || vars.HEAVY_RUNS_ON, 'macos-') || contains(inputs.runs-on != '' && inputs.runs-on || vars.HEAVY_RUNS_ON, 'windows-')) && 'hosted runner refused for a private repository - use the pool label' || inputs.runs-on != '' && inputs.runs-on || vars.HEAVY_RUNS_ON) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: No legacy share-mount deploy paths
        uses: gorfednet/.github/.github/actions/no-smb-guard@main
      - uses: actions/setup-python@v7
        if: inputs.python-verify-command != '' || inputs.make-test-command != ''
        with:
          python-version: ${{ inputs.python-version }}
      - uses: gorfednet/.github/.github/actions/setup-node@main
        if: inputs.build-command != ''
        with:
          node-version: ${{ inputs.node-version }}
      - name: Setup Node (verify only)
        if: inputs.node-verify-command != '' && inputs.build-command == ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ inputs.node-version }}
      - name: Install Node (audit only)
        if: inputs.run-audit-gate && inputs.node-verify-command == '' && inputs.build-command == ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: npm ci (audit only)
        if: inputs.run-audit-gate && inputs.node-verify-command == '' && inputs.build-command == ''
        run: npm ci
      - name: Build
        if: inputs.build-command != ''
        run: ${{ inputs.build-command }}
      - name: Build left tracked files unchanged
        if: ${{ inputs.build-command != '' && inputs.fail-on-build-edits == 'true' }}
        run: |
          if ! git diff --exit-code; then
            echo "::error::The build changed tracked files (diff above). Commit the regenerated output or make the build write nowhere tracked."
            exit 1
          fi
      - name: Python verify
        if: inputs.python-verify-command != ''
        run: ${{ inputs.python-verify-command }}
      - name: Node verify
        if: inputs.node-verify-command != ''
        run: ${{ inputs.node-verify-command }}
      - name: Make test
        if: inputs.make-test-command != ''
        run: ${{ inputs.make-test-command }}
      - name: npm audit gate
        if: inputs.run-audit-gate
        uses: gorfednet/.github/.github/actions/npm-audit-gate@main

      # Every check the fleet shares, in one step so a fix reaches all of
      # them. Runs last because it needs the test report, and `!cancelled()`
      # inside the action so an earlier failure cannot switch it off (V18).
      - name: Verification gate
        if: ${{ !cancelled() && inputs.verification-kit != '' }}
        uses: gorfednet/.github/.github/actions/verification-gate@main
        with:
          kit: ${{ inputs.verification-kit }}
          backlog: ${{ inputs.verification-backlog }}
          test-report: ${{ inputs.test-report }}
          min-tests: ${{ inputs.min-tests }}
          rule-sources: ${{ inputs.rule-sources }}
          source-dirs: ${{ inputs.source-dirs }}
          site-url: ${{ inputs.site-url }}
          metadata-pages: ${{ inputs.metadata-pages }}
          publish-root: ${{ inputs.publish-root }}
          og-max-bytes: ${{ inputs.og-max-bytes }}
          require-jsonld: ${{ inputs.require-jsonld }}
          error-page-root: ${{ inputs.error-page-root }}
          error-page-markers: ${{ inputs.error-page-markers }}
          allow-machine-paths: ${{ inputs.allow-machine-paths }}
          og-content-addressed: ${{ inputs.og-content-addressed }}
          sitemap-origin: ${{ inputs.sitemap-origin }}
          sitemap-files: ${{ inputs.sitemap-files }}
          sitemap-allow-thin: ${{ inputs.sitemap-allow-thin }}
          sitemap-min-words: ${{ inputs.sitemap-min-words }}
          privacy-date-config: ${{ inputs.privacy-date-config }}
