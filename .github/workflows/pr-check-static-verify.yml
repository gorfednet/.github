name: pr-check-static-verify

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version
        required: false
        type: string
        default: "22"
      python-version:
        description: Python version
        required: false
        type: string
        default: "3.x"
      build-command:
        description: Optional build command before verify
        required: false
        type: string
        default: ""
      python-verify-command:
        description: Python verification command
        required: false
        type: string
        default: ""
      node-verify-command:
        description: Node verification command
        required: false
        type: string
        default: ""
      make-test-command:
        description: Optional make test or similar
        required: false
        type: string
        default: ""
      run-audit-gate:
        description: Run npm audit gate when package-lock.json exists
        required: false
        type: boolean
        default: true

      verification-kit:
        description: >-
          Path to the vendored verification kit. Empty disables the gate.
          The default is empty on purpose: all fourteen projects already
          inherit these workflows, so a non-empty default would have turned
          every one of them red on the day the gate landed, and a fleet-wide
          red is indistinguishable from a fleet-wide outage. Adoption is
          opt-in and per project; FLEET.md is what stops "not yet" becoming
          permanent.
        required: false
        type: string
        default: ""
      verification-backlog:
        description: Path to the project's backlog. Empty skips that check.
        required: false
        type: string
        default: docs/backlog.json
      test-report:
        description: Playwright or Vitest JSON report to assert a floor against.
        required: false
        type: string
        default: ""
      min-tests:
        description: Executed-test floor. Set it to what the job runs today.
        required: false
        type: string
        default: "1"
      rule-sources:
        description: >-
          Space-separated roots to scan for rule citations. Defaults to the
          whole tree, which is right until a project vendors third-party code:
          towit.io ships a bundled AngularJS whose wrapped lines read as a
          citation of a rule numbered zero, which no editing of a third-party
          library can fix.

          The gate action has always had this input. No caller exposed it, so
          no project could set it — an input nothing can reach is the same as
          no input at all (rule V54).
        required: false
        type: string
        default: "."
      source-dirs:
        description: >-
          Space-separated directories that look generated but hold hand-written
          code here. `build/` is output nearly everywhere and is where
          gorfed.net keeps its Python build scripts, so the kit's list cannot
          simply drop it. Each one is printed on every run.
        required: false
        type: string
        default: ""
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: No legacy share-mount deploy paths
        uses: gorfednet/.github/.github/actions/no-smb-guard@main
      - uses: actions/setup-python@v5
        if: inputs.python-verify-command != '' || inputs.make-test-command != ''
        with:
          python-version: ${{ inputs.python-version }}
      - uses: gorfednet/.github/.github/actions/setup-node@main
        if: inputs.build-command != ''
        with:
          node-version: ${{ inputs.node-version }}
      - name: Setup Node (verify only)
        if: inputs.node-verify-command != '' && inputs.build-command == ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ inputs.node-version }}
      - name: Install Node (audit only)
        if: inputs.run-audit-gate && inputs.node-verify-command == '' && inputs.build-command == ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: npm ci (audit only)
        if: inputs.run-audit-gate && inputs.node-verify-command == '' && inputs.build-command == ''
        run: npm ci
      - name: Build
        if: inputs.build-command != ''
        run: ${{ inputs.build-command }}
      - name: Python verify
        if: inputs.python-verify-command != ''
        run: ${{ inputs.python-verify-command }}
      - name: Node verify
        if: inputs.node-verify-command != ''
        run: ${{ inputs.node-verify-command }}
      - name: Make test
        if: inputs.make-test-command != ''
        run: ${{ inputs.make-test-command }}
      - name: npm audit gate
        if: inputs.run-audit-gate
        uses: gorfednet/.github/.github/actions/npm-audit-gate@main

      # Every check the fleet shares, in one step so a fix reaches all of
      # them. Runs last because it needs the test report, and `!cancelled()`
      # inside the action so an earlier failure cannot switch it off (V18).
      - name: Verification gate
        if: ${{ !cancelled() && inputs.verification-kit != '' }}
        uses: gorfednet/.github/.github/actions/verification-gate@main
        with:
          kit: ${{ inputs.verification-kit }}
          backlog: ${{ inputs.verification-backlog }}
          test-report: ${{ inputs.test-report }}
          min-tests: ${{ inputs.min-tests }}
          rule-sources: ${{ inputs.rule-sources }}
          source-dirs: ${{ inputs.source-dirs }}
