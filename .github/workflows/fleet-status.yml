# The fleet's own status report: open pull requests, lapsed backlog items and red
# mains in one file, so a status report to the owner is read, not hand-counted
# (owner, 7 November 2026). Writes STATUS.md and status.json to the `status`
# branch of this repository and posts a short digest to ntfy.
#
# Like fleet-audit.yml it needs FLEET_READ_TOKEN (a fine-grained PAT with
# read-only Actions, Commit statuses, Contents, Dependabot alerts, Issues, Metadata and Pull requests across
# gorfednet; there is no Checks permission for a fine-grained token, so CI state comes
# from Actions runs and commit statuses) and
# has no fallback: a missing token means nothing was read, so it goes red.
# A repository it cannot read becomes an "unavailable" row and turns the job
# red after the file is published, so the gap is visible in both places.
# Without the Dependabot alerts permission a repository's "alerts past target" count reads
# UNKNOWN (never 0) and the run stays green: the alerts are one row, not the whole report.
#
# Whose quota the token spends (16 November 2026, plan row 1.17): almost certainly the owner's 5,000 an
# hour. At 11:32 ET, six minutes into a zero quota on the owner's side, the scheduled run found all 20
# repositories unreadable within a second; the run at 09:45 ET read all 20. Not proven, because the log
# kept no header and no cause. The "Quota of the read token" steps log the window's reset epoch: the same
# second as `resetAt` in the Mac's ~/.gh-quota/samples.jsonl means the same quota. Update this note from
# the first run that logs it.
name: fleet-status

on:
  schedule:
    # Every 2 hours (plan row 1.14), at :30 past, so detection is hours old at
    # most. One run is seconds on a hosted runner (the repository is public).
    - cron: '30 */2 * * *'
  workflow_dispatch:
# Not on pull_request: a pull request cannot be given the token.

permissions:
  contents: write

# Hosted, on purpose, for the same reason as fleet-audit.yml: this repository is
# public, so the dapyllil pool refuses it by design, and hosted runners are not
# billed for a public repository. One short job every 2 hours.
jobs:
  status:
    # Hosted: public repository, see the note above jobs.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      - name: A cross-repository token is present
        env:
          TOKEN: ${{ secrets.FLEET_READ_TOKEN }}
        run: |
          if [ -z "${TOKEN}" ]; then
            echo "::error::FLEET_READ_TOKEN is not set. Without it this report reads nothing."
            exit 1
          fi

      # Whose quota does this token spend? (16 November 2026, plan row 1.17.) The rate-limit headers carry the
      # window's limit, what is left and when it resets, and no name or secret. The reset epoch is the same
      # second as the owner's own window when the token is the owner's, so it can be matched against the
      # Mac's ~/.gh-quota/samples.jsonl (`resetAt`). Logged before and after the read, so a run's own spend is
      # `before - after`. Never fails the job: a quota that cannot be read is a warning.
      - name: Quota of the read token (before)
        env:
          GH_TOKEN: ${{ secrets.FLEET_READ_TOKEN }}
        run: |
          gh api -i rate_limit 2>&1 | tr -d '\r' | grep -i -E '^x-ratelimit-(limit|remaining|used|reset|resource):' \
            || echo "::warning::the read token's rate-limit headers could not be read"

      # Written even when a repository was unreadable (it appears as an
      # unavailable row); the exit code is kept and asserted after publishing.
      - name: Read the fleet
        id: read
        env:
          FLEET_READ_TOKEN: ${{ secrets.FLEET_READ_TOKEN }}
          EVENT: ${{ github.event_name }}
        run: |
          set +e
          # Light run: a scheduled run reuses the branch lists of the last published status.json while
          # that full read is under 23 hours old (the script decides, from `branchesReadAt`), which saves
          # the one-request-per-branch compare calls that make up most of a full read. The owner's
          # 5,000-an-hour quota is shared. A manual run is always full.
          carry=()
          if [ "${EVENT}" = "schedule" ] \
             && git fetch --quiet --depth 1 origin status \
             && git show origin/status:status.json > "${RUNNER_TEMP}/prior.json"; then
            carry=(--carry-branches "${RUNNER_TEMP}/prior.json")
          fi
          node scripts/fleet-status.mjs --inventory --out status.json "${carry[@]}"
          echo "code=$?" >> "$GITHUB_OUTPUT"
          # The ntfy digest goes out once a day, on the run that did the full read.
          echo "digest=$(node -p "require('./status.json').carried ? 'no' : 'yes'" 2>/dev/null || echo yes)" >> "$GITHUB_OUTPUT"
          test -s status.json

      - name: Quota of the read token (after)
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.FLEET_READ_TOKEN }}
        run: |
          gh api -i rate_limit 2>&1 | tr -d '\r' | grep -i -E '^x-ratelimit-(limit|remaining|used|reset|resource):' \
            || echo "::warning::the read token's rate-limit headers could not be read"

      # Plan row 1.30 d: this public repository's own upkeep (branches, merged branches not
      # deleted, files on main the privacy guard would refuse, README drift). Scheduled, never
      # per pull request (verification-floor rule 5). Git only, so no GitHub API quota is spent;
      # status.json gets counts and folder names, never a matched line. The digest carries it
      # on Mondays.
      - name: Measure this repository's upkeep
        if: ${{ !cancelled() }}
        env:
          PRIVATE_REPOS: ${{ secrets.PRIVATE_REPOS }}
        run: |
          set -euo pipefail
          test -s status.json
          git fetch --quiet --unshallow origin '+refs/heads/*:refs/remotes/origin/*' 2>/dev/null \
            || git fetch --quiet origin '+refs/heads/*:refs/remotes/origin/*'
          # A clone still shallow here would count no branch as merged; the script refuses one too.
          test "$(git rev-parse --is-shallow-repository)" = false
          node scripts/dotgithub-hygiene.mjs --in status.json

      - name: Render STATUS.md
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          node scripts/write-status-md.mjs --in status.json --out STATUS.md
          # The digest is made here, while the scripts exist: the publish step
          # checks out the `status` branch, which holds only the two output files.
          mkdir -p "${RUNNER_TEMP}/out"
          node scripts/write-status-md.mjs --in status.json --digest > "${RUNNER_TEMP}/out/digest.txt"

      # Scheduled, never per pull request: a pull request cannot change what the kit
      # released. Fails the run (and so the ops alert) when a repository is more than
      # one minor behind canonical. Before Publish, which checks out the status branch.
      - name: Every repository is within one minor of the canonical kit
        if: ${{ !cancelled() }}
        run: node scripts/fleet-kit-versions.mjs --in status.json

      - name: Publish to the status branch
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/out"
          cp STATUS.md status.json "${RUNNER_TEMP}/out/"
          # Untracked here, tracked on `status`: left in place, the checkout below
          # refuses to overwrite them from the second run on.
          rm -f STATUS.md status.json
          git config user.name "fleet-status"
          git config user.email "fleet-status@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin status >/dev/null 2>&1; then
            git fetch origin status
            git checkout -B status origin/status
          else
            git checkout --orphan status
            git rm -rf --quiet . || true
          fi
          cp "${RUNNER_TEMP}/out/STATUS.md" "${RUNNER_TEMP}/out/status.json" .
          git add STATUS.md status.json
          if git diff --cached --quiet; then
            echo "status unchanged"
          else
            git commit -m "fleet-status $(date -u +%Y-%m-%dT%H:%MZ)"
          fi
          git push --force-with-lease origin status

      - name: Post the digest to ntfy
        if: ${{ !cancelled() && steps.read.outputs.digest != 'no' }}
        env:
          NTFY_URL: https://ntfy.gorfed.net/ops-report
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: |
          set -euo pipefail
          digest="${RUNNER_TEMP}/out/digest.txt"
          test -s "${digest}"
          test "$(wc -l < "${digest}")" -le 10
          if [ -z "${NTFY_TOKEN:-}" ]; then
            echo "::warning::NTFY_TOKEN missing, digest not posted"
            exit 0
          fi
          curl -sS --fail --max-time 15 \
            -H "User-Agent: gorfednet-fleet-status (+https://github.com/gorfednet/.github)" \
            -H "Title: Fleet status" -H "Priority: default" -H "Tags: bar_chart" \
            -H "Authorization: Bearer ${NTFY_TOKEN}" \
            --data-binary @"${digest}" "${NTFY_URL}"

      # The read's exit code, asserted last so the file and digest go out first.
      - name: Every repository was readable
        if: ${{ !cancelled() }}
        env:
          CODE: ${{ steps.read.outputs.code }}
        run: |
          if [ "${CODE:-1}" != "0" ]; then
            echo "::error::fleet-status could not read every repository (exit ${CODE:-unset}); see the unavailable rows in STATUS.md"
            exit 1
          fi
