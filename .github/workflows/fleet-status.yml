# The fleet's own status report: open pull requests, lapsed backlog items and red
# mains in one file, so a status report to the owner is read, not hand-counted
# (owner, 7 November 2026). Writes STATUS.md and status.json to the `status`
# branch of this repository and posts a short digest to ntfy.
#
# Like fleet-audit.yml it needs FLEET_READ_TOKEN (a fine-grained PAT with
# read-only Actions, Commit statuses, Contents, Issues, Metadata and Pull requests across
# gorfednet; there is no Checks permission for a fine-grained token, so CI state comes
# from Actions runs and commit statuses) and
# has no fallback: a missing token means nothing was read, so it goes red.
# A repository it cannot read becomes an "unavailable" row and turns the job
# red after the file is published, so the gap is visible in both places.
name: fleet-status

on:
  schedule:
    # Every 2 hours (plan row 1.14), at :30 past, so detection is hours old at
    # most. One run is seconds on a hosted runner (the repository is public).
    - cron: '30 */2 * * *'
  workflow_dispatch:
# Not on pull_request: a pull request cannot be given the token.

# One run at a time, and a queued one waits instead of cancelling the one in flight: the published status.json is
# the memo of which Actions spend lines (70%, 90%) already went to ntfy, so two overlapping runs would both read
# the same memo and both push the same line.
concurrency:
  group: fleet-status
  cancel-in-progress: false

permissions:
  contents: write

# Hosted, on purpose, for the same reason as fleet-audit.yml: this repository is
# public, so the dapyllil pool refuses it by design, and hosted runners are not
# billed for a public repository. One short job every 2 hours.
jobs:
  status:
    # Hosted: public repository, see the note above jobs.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - name: A cross-repository token is present
        env:
          TOKEN: ${{ secrets.FLEET_READ_TOKEN }}
        run: |
          if [ -z "${TOKEN}" ]; then
            echo "::error::FLEET_READ_TOKEN is not set. Without it this report reads nothing."
            exit 1
          fi

      # Written even when a repository was unreadable (it appears as an
      # unavailable row); the exit code is kept and asserted after publishing.
      - name: Read the fleet
        id: read
        env:
          FLEET_READ_TOKEN: ${{ secrets.FLEET_READ_TOKEN }}
          # Optional. The billing read needs the Plan permission (read); when this secret is set it is used for
          # that one call, else FLEET_READ_TOKEN is. Unset and unpermitted: the spend reads "unknown", not zero.
          BILLING_READ_TOKEN: ${{ secrets.BILLING_READ_TOKEN }}
          # Signs the memo of which spend lines were pushed, so the public status.json holds no threshold.
          SPEND_MEMO_KEY: ${{ secrets.NTFY_TOKEN }}
          EVENT: ${{ github.event_name }}
        run: |
          set +e
          # Light run: a scheduled run reuses the branch lists of the last published status.json while
          # that full read is under 23 hours old (the script decides, from `branchesReadAt`), which saves
          # the one-request-per-branch compare calls that make up most of a full read. The owner's
          # 5,000-an-hour quota is shared. A manual run is always full.
          carry=()
          memo=()
          # The last published status.json is the spend alerts' memo (which thresholds already went to ntfy this
          # month), so it is read on every run, a manual one too. A branch that does not exist yet is a first run:
          # nothing was fired. A branch that exists but cannot be read, or reads as damaged, is not "nothing
          # fired": it would push every due line again, so the run publishes nothing and fails (see Publish).
          prior=absent
          rc=0
          git ls-remote --exit-code --heads origin status >/dev/null 2>&1 || rc=$?
          if [ "${rc}" = "0" ]; then
            if git fetch --quiet --depth 1 origin status \
               && git show origin/status:status.json > "${RUNNER_TEMP}/prior.json" \
               && node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "${RUNNER_TEMP}/prior.json"; then
              prior=ok
              memo=(--spend-memo "${RUNNER_TEMP}/prior.json")
              if [ "${EVENT}" = "schedule" ]; then carry=(--carry-branches "${RUNNER_TEMP}/prior.json"); fi
            else
              prior=failed
            fi
          elif [ "${rc}" != "2" ]; then
            prior=failed
          fi
          echo "prior=${prior}" >> "$GITHUB_OUTPUT"
          # The full spend reading is written beside the run, never into status.json (a public file).
          node scripts/fleet-status.mjs --inventory --out status.json --spend-out "${RUNNER_TEMP}/spend.json" "${memo[@]}" "${carry[@]}"
          echo "code=$?" >> "$GITHUB_OUTPUT"
          # The ntfy digest goes out once a day, on the run that did the full read.
          echo "digest=$(node -p "require('./status.json').carried ? 'no' : 'yes'" 2>/dev/null || echo yes)" >> "$GITHUB_OUTPUT"
          test -s status.json

      # Plan row 1.30 d: this public repository's own upkeep (branches, merged branches not
      # deleted, files on main the privacy guard would refuse, README drift). Scheduled, never
      # per pull request (verification-floor rule 5). Git only, so no GitHub API quota is spent;
      # status.json gets counts and folder names, never a matched line. The digest carries it
      # on Mondays.
      - name: Measure this repository's upkeep
        if: ${{ !cancelled() }}
        env:
          PRIVATE_REPOS: ${{ secrets.PRIVATE_REPOS }}
        run: |
          set -euo pipefail
          test -s status.json
          git fetch --quiet --unshallow origin '+refs/heads/*:refs/remotes/origin/*' 2>/dev/null \
            || git fetch --quiet origin '+refs/heads/*:refs/remotes/origin/*'
          # A clone still shallow here would count no branch as merged; the script refuses one too.
          test "$(git rev-parse --is-shallow-repository)" = false
          node scripts/dotgithub-hygiene.mjs --in status.json

      - name: Render STATUS.md
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          node scripts/write-status-md.mjs --in status.json --out STATUS.md
          # The digest is made here, while the scripts exist: the publish step
          # checks out the `status` branch, which holds only the two output files.
          mkdir -p "${RUNNER_TEMP}/out"
          # The digest goes to ntfy only, so it carries the private spend figures that STATUS.md leaves out.
          node scripts/write-status-md.mjs --in status.json --digest --spend "${RUNNER_TEMP}/spend.json" > "${RUNNER_TEMP}/out/digest.txt"
          # Publish checks out the `status` branch, which holds no scripts: keep the spend alert's copy here.
          mkdir -p "${RUNNER_TEMP}/tools/templates/verification-kit/lib"
          cp -R scripts "${RUNNER_TEMP}/tools/scripts"
          cp templates/verification-kit/lib/isMain.mjs "${RUNNER_TEMP}/tools/templates/verification-kit/lib/"

      # Scheduled, never per pull request: a pull request cannot change what the kit
      # released. Fails the run (and so the ops alert) when a repository is more than
      # one minor behind canonical. Before Publish, which checks out the status branch.
      - name: Every repository is within one minor of the canonical kit
        if: ${{ !cancelled() }}
        run: node scripts/fleet-kit-versions.mjs --in status.json

      # Skipped, and the run fails, when the last published status.json could not be read: it is the spend
      # alerts' memo, and publishing without it would let the next run push every due line again.
      - name: Publish to the status branch
        id: publish
        if: ${{ !cancelled() && steps.read.outputs.prior != 'failed' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/out"
          cp STATUS.md status.json "${RUNNER_TEMP}/out/"
          # Untracked here, tracked on `status`: left in place, the checkout below
          # refuses to overwrite them from the second run on.
          rm -f STATUS.md status.json
          git config user.name "fleet-status"
          git config user.email "fleet-status@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin status >/dev/null 2>&1; then
            git fetch origin status
            git checkout -B status origin/status
          else
            git checkout --orphan status
            git rm -rf --quiet . || true
          fi
          cp "${RUNNER_TEMP}/out/STATUS.md" "${RUNNER_TEMP}/out/status.json" .
          git add STATUS.md status.json
          if git diff --cached --quiet; then
            echo "status unchanged"
          else
            git commit -m "fleet-status $(date -u +%Y-%m-%dT%H:%MZ)"
            echo "committed=yes" >> "${GITHUB_OUTPUT:-/dev/null}"
          fi
          git push --force-with-lease origin status

      # Hosted Actions spend (replan row N6): one ntfy line at 70%, 90% and 100% of the month's cap, with the
      # figures (ntfy is private; the public files carry a state only). It runs after Publish and only when Publish
      # succeeded, so a failed Publish can never repeat a line every 2 hours. A failed push warns and retries on
      # the next run; it never fails the job.
      - name: Post the Actions spend thresholds to ntfy
        id: spend
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        env:
          NTFY_URL: https://ntfy.gorfed.net/ops-report
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          SPEND_MEMO_KEY: ${{ secrets.NTFY_TOKEN }}
        run: node "${RUNNER_TEMP}/tools/scripts/actions-spend-alert.mjs" --in status.json --spend "${RUNNER_TEMP}/spend.json"

      # The line it pushed is recorded in status.json (`actions.memo`, opaque) on the status branch, so the next run
      # starts from it. It amends this run's Publish commit (or makes the run's only commit when Publish found
      # nothing to commit), so the branch history holds one commit per run and no commit time says when a
      # threshold was crossed. If this push fails the next run pushes the line once more: noise, never a lost alert.
      - name: Record the pushed spend lines on the status branch
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        env:
          COMMITTED: ${{ steps.publish.outputs.committed }}
        run: |
          set -euo pipefail
          git add status.json
          if git diff --cached --quiet; then
            echo "spend memo unchanged"
          elif [ "${COMMITTED:-}" = "yes" ]; then
            git commit --amend --no-edit --quiet
            git push --force-with-lease origin status
          else
            git commit -m "fleet-status $(date -u +%Y-%m-%dT%H:%MZ)"
            git push --force-with-lease origin status
          fi

      - name: Post the digest to ntfy
        if: ${{ !cancelled() && steps.read.outputs.digest != 'no' }}
        env:
          NTFY_URL: https://ntfy.gorfed.net/ops-report
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: |
          set -euo pipefail
          digest="${RUNNER_TEMP}/out/digest.txt"
          test -s "${digest}"
          test "$(wc -l < "${digest}")" -le 10
          if [ -z "${NTFY_TOKEN:-}" ]; then
            echo "::warning::NTFY_TOKEN missing, digest not posted"
            exit 0
          fi
          # ntfy answers a publish with the message as JSON, and this log is public: the body goes nowhere and only
          # the status code is printed. The digest carries the private spend figures.
          curl -sS --fail --max-time 15 -o /dev/null -w 'ntfy digest: HTTP %{http_code}\n' \
            -H "User-Agent: gorfednet-fleet-status (+https://github.com/gorfednet/.github)" \
            -H "Title: Fleet status" -H "Priority: default" -H "Tags: bar_chart" \
            -H "Authorization: Bearer ${NTFY_TOKEN}" \
            --data-binary @"${digest}" "${NTFY_URL}"

      # The read's exit code, asserted last so the file and digest go out first.
      - name: Every repository was readable
        if: ${{ !cancelled() }}
        env:
          CODE: ${{ steps.read.outputs.code }}
          PRIOR: ${{ steps.read.outputs.prior }}
        run: |
          if [ "${PRIOR:-failed}" = "failed" ]; then
            echo "::error::the last published status.json could not be read, so nothing was published this run (it is the spend alerts' memo)"
            exit 1
          fi
          if [ "${CODE:-1}" != "0" ]; then
            echo "::error::fleet-status could not read every repository (exit ${CODE:-unset}); see the unavailable rows in STATUS.md"
            exit 1
          fi
