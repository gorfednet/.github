name: production-healthcheck

on:
  workflow_call:
    inputs:
      site-url:
        description: Production site base URL (no trailing slash)
        required: true
        type: string
      health-paths:
        description: Comma-separated paths to check
        required: false
        type: string
        default: "/"
      node-version:
        description: Node.js version for Playwright live smoke
        required: false
        type: string
        default: "22"
      expect-text:
        description: >-
          A string that must appear in the body of the FIRST health path.
          A status code says a server answered, not that it served the site:
          a parking page, a CDN error page and a blank 200 all pass a code
          check. Empty falls back to the size floor below, which is weaker.
        required: false
        type: string
        default: ""
      min-bytes:
        description: >-
          Smallest acceptable body for each health path. Catches the blank-200
          case when no expect-text is given.
        required: false
        type: string
        default: "512"
      smoke-spec:
        description: Playwright spec to run against the live site.
        required: false
        type: string
        default: e2e/smoke.spec.ts
      run-playwright:
        description: >-
          Run Playwright smoke against live URL. When true the spec must
          exist — a missing spec fails rather than being skipped, because a
          monitor that prints a tick for a file it could not find is worse
          than no monitor. Projects with no spec pass false and say so.
        required: false
        type: boolean
        default: true

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # A status code tells you a server answered. It does not tell you the
      # site is there: a parking page, a CDN error page, an empty 200 and a
      # redirect to somebody else's domain all satisfy `code < 400`. Each path
      # is fetched, kept, and inspected.
      - name: HTTP health checks
        env:
          EXPECT_TEXT: ${{ inputs.expect-text }}
        run: |
          set -euo pipefail
          base="${{ inputs.site-url }}"
          host="$(printf '%s' "$base" | sed -E 's#^https?://##; s#/.*##')"
          min_bytes="${{ inputs.min-bytes }}"
          IFS=',' read -ra paths <<< "${{ inputs.health-paths }}"

          if [ "${#paths[@]}" -eq 0 ]; then
            echo "::error::No health paths. A loop over nothing passes."
            exit 1
          fi

          checked=0
          matched=0
          for path in "${paths[@]}"; do
            path="$(echo "$path" | xargs)"
            [ -n "$path" ] || continue
            url="${base}${path}"
            body="$(mktemp)"
            read -r code final < <(curl -sS -o "$body" \
              -w '%{http_code} %{url_effective}' -L --max-time 30 "$url")
            bytes="$(wc -c < "$body" | tr -d ' ')"
            echo "$url → HTTP $code, ${bytes} bytes, settled at $final"

            if [[ "$code" -lt 200 || "$code" -ge 400 ]]; then
              echo "::error::$url returned HTTP $code"
              exit 1
            fi

            # A redirect off the origin is how a lapsed domain keeps answering
            # 200 from a registrar's parking page.
            final_host="$(printf '%s' "$final" | sed -E 's#^https?://##; s#/.*##')"
            if [ "$final_host" != "$host" ]; then
              echo "::error::$url redirected to $final_host, off $host."
              exit 1
            fi

            if [ "$bytes" -lt "$min_bytes" ]; then
              echo "::error::$url returned $bytes bytes, under the $min_bytes floor." \
                   "An empty 200 is the shape of a broken deploy."
              exit 1
            fi

            # The content match used to run on the first path only, which made
            # every other path a status-and-size check. A route whose
            # server-side fallback has gone missing, and which therefore serves
            # the application shell instead of its own page, answers 200 at a
            # healthy size — so the one failure a multi-path monitor exists to
            # catch was the one it could not see. Found on gorfmusic.com, where
            # five of six listed paths were unverified beyond their length.
            #
            # It now runs on every HTML response. Not every response: callers
            # legitimately list stylesheets and scripts, and a phrase from the
            # markup is not in those. Content-Type decides, so the rule is
            # "everything that claims to be a page must look like this site"
            # rather than a guess from the path.
            if [ -n "${EXPECT_TEXT}" ]; then
              ctype="$(curl -sSI -L --max-time 30 "$url" \
                | tr -d '\r' | awk -F': ' 'tolower($1)=="content-type"{print tolower($2)}' | tail -1)"
              case "$ctype" in
                text/html*)
                  if ! grep -qF -- "${EXPECT_TEXT}" "$body"; then
                    echo "::error::$url did not contain the expected text." \
                         "The server answered; it did not serve this page."
                    exit 1
                  fi
                  echo "  body contains the expected text"
                  matched=$((matched + 1))
                  ;;
                *) echo "  not HTML ($ctype), content match skipped" ;;
              esac
            fi

            rm -f "$body"
            checked=$((checked + 1))
          done

          echo "checked $checked path(s), content-matched $matched"
          if [ "$checked" -eq 0 ]; then
            echo "::error::Zero paths checked. This job proved nothing."
            exit 1
          fi
          # An expect-text that matched nothing is an expect-text that is not
          # running, and it reads identically in the log to one that passed.
          if [ -n "${EXPECT_TEXT}" ] && [ "$matched" -eq 0 ]; then
            echo "::error::expect-text was given but no path returned HTML," \
                 "so the content match never ran. Either the paths are all" \
                 "assets, or the server is not serving HTML where it should."
            exit 1
          fi
          if [ -z "${EXPECT_TEXT}" ]; then
            echo "::warning::No expect-text given, so this run verified size" \
                 "and origin but never looked at the content."
          fi
      - name: Setup Node for Playwright
        if: inputs.run-playwright
        uses: gorfednet/.github/.github/actions/setup-node@main
        with:
          node-version: ${{ inputs.node-version }}
      - uses: gorfednet/.github/.github/actions/setup-playwright@main
        if: inputs.run-playwright
      # This step used to `exit 0` when the spec file was absent, printing
      # "skipping" into a green job. Renaming a spec, or moving it into a
      # subdirectory, therefore silently ended live monitoring for a project
      # that still believed it had it. Asking for the smoke and not having it
      # is now a failure; not wanting it is `run-playwright: false`, which is a
      # decision somebody made and can be read off the caller's workflow.
      - name: Playwright live smoke
        if: ${{ !cancelled() && inputs.run-playwright }}
        run: |
          set -euo pipefail
          spec="${{ inputs.smoke-spec }}"
          if [[ ! -f "$spec" ]]; then
            echo "::error::run-playwright is true but $spec does not exist." \
                 "Point smoke-spec at the real file, or set run-playwright: false" \
                 "and accept that nothing is watching this site's behaviour."
            exit 1
          fi
          # `--reporter=list,json` rather than json alone: with only the JSON
          # reporter and stdout redirected, a failed live smoke leaves nothing
          # human-readable in the log, and the report is not uploaded — so the
          # person opening the run to find out what broke finds an empty page.
          # PLAYWRIGHT_JSON_OUTPUT_NAME keeps the machine copy off stdout.
          PLAYWRIGHT_JSON_OUTPUT_NAME=pw-live.json \
            npx playwright test "$spec" --project=chromium --reporter=list,json
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: ${{ inputs.site-url }}

      # A suite where every test is filtered out exits 0. Only a count
      # distinguishes a green run that checked the site from a green run that
      # checked nothing.
      - name: Assert the live smoke actually ran
        if: ${{ !cancelled() && inputs.run-playwright }}
        run: |
          set -euo pipefail
          if [ -f verification-kit/bin/assert-tests-executed.mjs ]; then
            node verification-kit/bin/assert-tests-executed.mjs \
              --report pw-live.json --min 1 --label live-smoke
          else
            # Counting specs would count skipped ones, and a fully skipped
            # suite is exactly the condition this step exists to catch — most
            # of the fleet has no kit yet, so this fallback is what they get.
            count=$(node -e "
              const r = require('./pw-live.json');
              const walk = (s) => s.reduce((n, x) =>
                n
                + (x.specs ?? []).reduce((m, spec) =>
                    m + (spec.tests ?? []).filter((t) => t.status !== 'skipped').length, 0)
                + walk(x.suites ?? []), 0);
              console.log(walk(r.suites ?? []));
            ")
            echo "live smoke executed $count spec(s)"
            [ "$count" -ge 1 ] || {
              echo "::error::The live smoke executed no specs."
              exit 1
            }
          fi
