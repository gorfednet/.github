# Pull request review by Claude: the only reviewer (Cursor Bugbot was retired on 2026-10-16).
#
# The review itself is claude-review.yml beside this file, the shared one every repository calls.
# It runs when a pull request opens or leaves draft, and on a comment with a line that is exactly "claude review" (skipped, with a comment, when the head already has a verdict; "claude review force" reviews it again).
# Merge gate:
#   node <gorfednet/.github clone>/scripts/review-status.mjs --pr <n> --repo gorfednet/<repository>
# House rules for the reviewer: REVIEW.md at the repository root.
name: claude-review (this repository)

on:
  pull_request:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    uses: gorfednet/.github/.github/workflows/claude-review.yml@main
    # No runs-on input: this repository is public, so the reusable always runs it GitHub-hosted, free.
    # Never set HEAVY_RUNS_ON on a public repository: the pool serves none, and the reusable ignores it.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
