# Pull request review by Claude: the only reviewer (Cursor Bugbot was retired on 2026-10-16).
#
# The review itself is claude-review.yml beside this file, the shared one every repository calls.
# It runs when a pull request opens or leaves draft, and again on a comment with a line that is exactly "claude review".
# Merge gate:
#   node <gorfednet/.github clone>/scripts/review-status.mjs --pr <n> --repo gorfednet/<repository>
# House rules for the reviewer: REVIEW.md at the repository root.
name: claude-review (this repository)

on:
  pull_request:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    uses: gorfednet/.github/.github/workflows/claude-review.yml@main
    with:
      # This repository has no pool label yet, so an unset HEAVY_RUNS_ON is passed as an explicit
      # hosted value. Drop the fallback once the variable is set here (owner, 2026-11-20).
      runs-on: ${{ vars.HEAVY_RUNS_ON || '"ubuntu-latest"' }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
