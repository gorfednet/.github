name: pr-check-vite-spa

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version
        required: false
        type: string
        default: "22"
      build-command:
        description: Build command
        required: false
        type: string
        default: npm run build
      lint-command:
        description: Optional lint/typecheck command
        required: false
        type: string
        default: ""
      extra-verify-command:
        description: Optional post-build verification command
        required: false
        type: string
        default: ""
      run-audit-gate:
        description: Run npm audit gate
        required: false
        type: boolean
        default: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: No legacy share-mount deploy paths
        run: |
          set -euo pipefail
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep
          fi
          matches="$(rg -n -i -e 'smb://|mount_smbfs|\bcifs\b|/Volumes/' \
            --glob '!node_modules/**' --glob '!dist/**' --glob '!**/assets/**' \
            --glob '!**/*.min.js' --glob '!package-lock.json' \
            . 2>/dev/null || true)"
          if [[ -n "$matches" ]]; then
            echo "::error::Legacy share-mount deploy references found — deploy must be SSH-only"
            echo "$matches"
            exit 1
          fi
          echo "OK: SSH-only deploy paths"
      - uses: gorfednet/.github/.github/actions/setup-node@main
        with:
          node-version: ${{ inputs.node-version }}
      - name: Lint
        if: inputs.lint-command != ''
        run: ${{ inputs.lint-command }}
      - name: Build
        run: ${{ inputs.build-command }}
      - name: Extra verify
        if: inputs.extra-verify-command != ''
        run: ${{ inputs.extra-verify-command }}
      - name: npm audit gate
        if: inputs.run-audit-gate
        uses: gorfednet/.github/.github/actions/npm-audit-gate@main
