name: pr-check-fullstack

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version
        required: false
        type: string
        default: "22"
      frontend-build-command:
        description: Frontend build command
        required: false
        type: string
        default: npm run build
      frontend-test-command:
        description: Frontend test command
        required: false
        type: string
        default: npm test -- --run
      lint-command:
        description: Frontend lint command (skipped when empty)
        required: false
        type: string
        default: ""
      server-directory:
        description: Server package directory
        required: false
        type: string
        default: server
      server-test-command:
        description: Server test command
        required: false
        type: string
        default: npm test -- --run

      verification-kit:
        description: >-
          Path to the vendored verification kit. Empty disables the gate.
          The default is empty on purpose: all fourteen projects already
          inherit these workflows, so a non-empty default would have turned
          every one of them red on the day the gate landed, and a fleet-wide
          red is indistinguishable from a fleet-wide outage. Adoption is
          opt-in and per project; FLEET.md is what stops "not yet" becoming
          permanent.
        required: false
        type: string
        default: ""
      verification-backlog:
        description: Path to the project's backlog. Empty skips that check.
        required: false
        type: string
        default: docs/backlog.json
      test-report:
        description: Playwright or Vitest JSON report to assert a floor against.
        required: false
        type: string
        default: ""
      min-tests:
        description: Executed-test floor. Set it to what the job runs today.
        required: false
        type: string
        default: "1"
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: gorfednet/.github/.github/actions/setup-node@main
        with:
          node-version: ${{ inputs.node-version }}
      - name: Frontend lint
        if: inputs.lint-command != ''
        run: ${{ inputs.lint-command }}
      - name: Frontend tests
        if: inputs.frontend-test-command != ''
        run: ${{ inputs.frontend-test-command }}
      - name: Frontend build
        run: ${{ inputs.frontend-build-command }}
      - name: Install server dependencies
        working-directory: ${{ inputs.server-directory }}
        run: |
          if [[ -f package-lock.json ]]; then
            npm ci
          else
            npm install
          fi
      - name: Server tests
        if: inputs.server-test-command != ''
        working-directory: ${{ inputs.server-directory }}
        run: ${{ inputs.server-test-command }}
      - name: npm audit gate
        uses: gorfednet/.github/.github/actions/npm-audit-gate@main
        with:
          extra-workspaces: server:${{ inputs.server-directory }}

      # Every check the fleet shares, in one step so a fix reaches all of
      # them. Runs last because it needs the test report, and `!cancelled()`
      # inside the action so an earlier failure cannot switch it off (V18).
      - name: Verification gate
        if: ${{ !cancelled() && inputs.verification-kit != '' }}
        uses: gorfednet/.github/.github/actions/verification-gate@main
        with:
          kit: ${{ inputs.verification-kit }}
          backlog: ${{ inputs.verification-backlog }}
          test-report: ${{ inputs.test-report }}
          min-tests: ${{ inputs.min-tests }}
