# Monthly dependency PRs for this repository's workflows, everything grouped into one.
# Security updates are grouped too (applies-to: security-updates), so one advisory
# wave is one PR. This repository has no package.json, so there is no npm entry.

version: 2
updates:
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
          - major
      actions-security:
        applies-to: security-updates
        patterns:
          - '*'
