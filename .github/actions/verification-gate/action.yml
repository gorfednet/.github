name: verification-gate
description: >-
  Run the verification kit's checks against the calling repository. Projects
  inherit this by upgrading the `uses:` line on their existing pr-check
  workflow; nothing needs adding to the project's own workflow file.

inputs:
  kit:
    description: >-
      Ignored since the 2026-10 right-sizing. The gate runs the kit from its own
      checkout (this repository at the ref the caller pinned), never from a copy
      vendored into the calling repository. Still declared so callers that pass
      it do not break.
    required: false
    default: verification-kit
  backlog:
    description: Path to the project's backlog. Empty skips the backlog check.
    required: false
    default: docs/backlog.json
  test-report:
    description: >-
      Playwright or Vitest JSON report to assert an executed count against.
      Empty skips the assertion, which is only right for a project with no
      tests — a Tier 1 project.
    required: false
    default: ""
  min-tests:
    description: Executed-test floor. Set it to what the job runs today.
    required: false
    default: "1"
  rule-sources:
    description: >-
      Ignored since the 2026-10 right-sizing, which removed the rule-citation
      step (this repository checks its own rule sequence in verification-kit.yml).
      Still declared so callers that pass it do not break.
    required: false
    default: "."
  source-dirs:
    description: >-
      Space-separated directories that look generated but hold hand-written
      code in this repository. `build/` is output nearly everywhere and is
      where gorfed.net keeps its Python build scripts. Each one is printed on
      every run, so the exception stays visible.
    required: false
    default: ""
  site-url:
    description: >-
      Production base URL, no trailing slash. Required by the metadata and
      og:image checks, which have to know what "on this site" means before they
      can tell an absolute local URL from a third-party hotlink. Empty skips
      both, which is right only for a project that ships no HTML.
    required: false
    default: ""
  metadata-pages:
    description: >-
      Space-separated HTML files to check, one per route the site actually
      serves — not just the homepage.

      ssatcy.com is why this is a list. It builds one shell for seven routes, so
      six of its pages emitted the homepage's canonical and could not rank,
      while every homepage-level check in the fleet passed. A representative
      page is not a sample of a per-page property; it is the page that works.
    required: false
    default: ""
  publish-root:
    description: >-
      Directory the site's URL paths resolve against on disk, so an og:image URL
      can be turned back into bytes to open. Usually `dist` or `public`.
    required: false
    default: ""
  og-max-bytes:
    description: >-
      Ceiling for the social card image. denseware.com pointed og:image at a
      3840x4557 background weighing 2.1 MB; some scrapers give up first.
    required: false
    default: "300000"
  require-jsonld:
    description: >-
      When "true", every checked page must carry a JSON-LD block. Off by
      default because a Tier 1 holding page has nothing to describe.
    required: false
    default: "false"
  allow-machine-paths:
    description: >-
      Space-separated substrings waiving a deliberate absolute path from
      check-machine-paths (V73). The waiver lives here, in the caller's config,
      rather than as a marker inside the file it excuses — a reader auditing what
      this repository is allowed to hardcode should not have to grep for it.
      denseware.com is the fleet's only user: an Apache AuthUserFile path in a
      2009 webalizer archive that nginx never reads.
    required: false
    default: ""
  error-page-root:
    description: >-
      Directory that should contain 404.html and 500.html. Empty skips the
      check. This is only the repository half — the server half is the live
      probe in production-healthcheck, because a 404.html nginx was never told
      to serve is exactly as useful as no file (V66).
    required: false
    default: ""
  error-page-markers:
    description: >-
      Space-separated strings from this site's own design that must appear in
      each error page. Without one, "the file exists" is the whole assertion,
      and a placeholder added to turn a check green satisfies it.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # Every step below carries `if: ${{ !cancelled() }}`.
    #
    # GitHub defaults a step to `success()`, so one failure switches off every
    # check after it — and on the run that taught us this, the thing that
    # failed was an artifact upload returning 403 for reasons unrelated to the
    # tests, which skipped the assertion whose whole purpose was proving the
    # job was not inert. A verification step ordered behind something that can
    # fail for an unrelated reason is not a gate. See rule V18.
    #
    # 2026-10 right-sizing. A pull request check fails only on something that
    # pull request can change. The kit this gate runs is no longer the copy
    # vendored into the calling repository: it is the copy in this repository
    # at the ref the caller pinned, so there is nothing in the consumer to
    # drift, and no check for drift. What a consumer's change cannot affect (the
    # kit's own correctness, rule numbering, a dated grace window) is
    # checked where it can be changed (verification-kit.yml here) or reported
    # on a schedule (fleet-audit.yml). The page-shaped and repository-shaped
    # checks that remain report with a `::warning` annotation and do not fail
    # the job; docs/verification-rules.md ("2026-10 right-sizing") records, for
    # each one, what still catches its class. What stays enforced is what the
    # change under review decides: the consumer's own build and tests, and the
    # executed-count floor that proves they ran.

    # When a workflow says `uses: gorfednet/.github/.github/actions/verification-gate@<ref>`
    # the runner downloads this whole repository at <ref> and runs the action
    # from `<workspace-runner>/_actions/gorfednet/.github/<ref>/.github/actions/verification-gate`
    # (that is `github.action_path`). Three levels up (verification-gate ->
    # actions -> .github -> repository root) is this repository's root, and the
    # kit is at templates/verification-kit under it. Resolved once here and read
    # as $VERIFICATION_GATE_KIT by every step below.
    - name: Locate the kit this gate runs
      if: ${{ !cancelled() }}
      shell: bash
      run: |
        set -euo pipefail
        wanted="${{ github.action_path }}/../../../templates/verification-kit"
        # The `cd` is inside the test, so a missing folder reaches the message
        # below instead of ending the step under `set -e` with no word of whose
        # fault it is.
        if ! kit="$(cd "$wanted" 2>/dev/null && pwd)" || [ ! -f "$kit/bin/check-backlog.mjs" ]; then
          echo "::error::The verification kit was not found at $wanted. This action is" \
               "broken at the ref it was pinned to; it is not a problem in the calling repository."
          exit 1
        fi
        echo "VERIFICATION_GATE_KIT=$kit" >> "$GITHUB_ENV"
        echo "kit: $kit"

    - name: No generated files tracked in git
      if: ${{ !cancelled() }}
      shell: bash
      run: |
        if ! node "$VERIFICATION_GATE_KIT/bin/check-tracked-artifacts.mjs" \
          $(for dir in ${{ inputs.source-dirs }}; do printf -- '--source %s ' "$dir"; done); then
          echo "::warning title=No generated files tracked in git::Generated files are tracked in git. See this step's log for the paths; untrack them or list the directory in source-dirs."
        fi

    # Both of these need --site-url and a page list. A caller that supplies one
    # and not the other has half-wired the gate, which is worse than not wiring
    # it: the run goes green having skipped the check silently. So the mismatch
    # is reported rather than skipped.
    - name: Metadata and social-card inputs agree
      if: ${{ !cancelled() }}
      shell: bash
      run: |
        url="${{ inputs.site-url }}"
        pages="${{ inputs.metadata-pages }}"
        root="${{ inputs.publish-root }}"
        inputs_agree() {
          if [ -n "$pages" ] && [ -z "$url" ]; then
            echo "metadata-pages is set but site-url is not, so the" \
                 "metadata and og:image checks were skipped. Set site-url."
            return 1
          fi
          if [ -n "$url" ] && [ -z "$pages" ]; then
            echo "site-url is set but metadata-pages is empty, so the" \
                 "metadata check has nothing to read and would pass over zero pages."
            return 1
          fi
          if [ -n "$pages" ] && [ -z "$root" ]; then
            echo "metadata-pages is set but publish-root is not, so no" \
                 "og:image could be resolved to bytes. Set publish-root."
            return 1
          fi
        }
        if ! inputs_agree; then
          echo "::warning title=Metadata and social-card inputs agree::The site-url, metadata-pages and publish-root inputs do not agree, so the metadata checks did not run as configured. See this step's log."
        fi

    # `!cancelled()` on every check above is deliberate (V18): an earlier failure
    # must not be able to switch the gate off. The cost is that when the failure
    # was early enough to skip Build, the gate runs against a publish set that
    # was never produced — and every page-shaped check then reports its own file
    # as missing. ssatcy.com's run showed eighteen ENOENTs from three checkers,
    # all of them true and none of them the cause, while the one real failure sat
    # a screen and a half above them.
    #
    # So the gate says the one thing those eighteen lines could not: the
    # directory is not there. It does not turn the checks off; it names the
    # missing directory once, accurately, ahead of the noise.
    - name: The publish set the gate was asked to read exists
      if: ${{ !cancelled() && (inputs.publish-root != '' || inputs.error-page-root != '') }}
      shell: bash
      run: |
        publish_set_exists() {
          for root in "${{ inputs.publish-root }}" "${{ inputs.error-page-root }}"; do
            [ -n "$root" ] || continue
            if [ ! -d "$root" ]; then
              echo "The gate was asked to read \"$root\" and there is no such" \
                   "directory. Every check below it will report its own file missing," \
                   "which is true and is not the cause. Look for the first failed or" \
                   "skipped step in this job: if Build did not run, that is why."
              return 1
            fi
            if [ -z "$(find "$root" -type f -print -quit)" ]; then
              echo "The gate was asked to read \"$root\" and it contains no" \
                   "files. A build that produced an empty directory fails here rather" \
                   "than one check at a time."
              return 1
            fi
          done
        }
        if ! publish_set_exists; then
          echo "::warning title=The publish set the gate was asked to read exists::A directory the gate was asked to read is missing or empty. The page checks below will report their own files missing; look for the first failed or skipped step in this job."
        fi

    - name: Page metadata is per-page and correct
      if: ${{ !cancelled() && inputs.metadata-pages != '' }}
      shell: bash
      run: |
        if ! node "$VERIFICATION_GATE_KIT/bin/check-page-metadata.mjs" \
          --site-url "${{ inputs.site-url }}" \
          ${{ inputs.require-jsonld == 'true' && '--require-jsonld' || '' }} \
          $(for page in ${{ inputs.metadata-pages }}; do printf -- '--page %s ' "$page"; done); then
          echo "::warning title=Page metadata is per-page and correct::A checked page has missing, duplicated or wrong metadata (canonical, title, description, JSON-LD). See this step's log."
        fi

    - name: The social card is the image it says it is
      if: ${{ !cancelled() && inputs.metadata-pages != '' }}
      shell: bash
      run: |
        if ! node "$VERIFICATION_GATE_KIT/bin/check-og-image.mjs" \
          --site-url "${{ inputs.site-url }}" \
          --root "${{ inputs.publish-root }}" \
          --max-bytes "${{ inputs.og-max-bytes }}" \
          $(for page in ${{ inputs.metadata-pages }}; do printf -- '--page %s ' "$page"; done); then
          echo "::warning title=The social card is the image it says it is::An og:image does not resolve to an image of the stated kind and size. See this step's log."
        fi

    - name: Error pages ship with the site
      if: ${{ !cancelled() && inputs.error-page-root != '' }}
      shell: bash
      run: |
        if ! node "$VERIFICATION_GATE_KIT/bin/check-error-pages.mjs" \
          --root "${{ inputs.error-page-root }}" \
          $(for marker in ${{ inputs.error-page-markers }}; do printf -- '--expect-text %s ' "$marker"; done); then
          echo "::warning title=Error pages ship with the site::404.html or 500.html is missing or is a placeholder. See this step's log."
        fi

    # Unconditional, unlike the checks above it. This one needs no configuration
    # to be meaningful — every repository has a git index — and the defect it
    # catches is one CI can only report by accident: a script that resolves a
    # dependency from a sibling checkout fails on the runner if something happens
    # to run it, and stays invisible if nothing does. Two of the three instances
    # in this fleet were in the second category.
    #
    # (The title says "%2C" for the comma: annotation properties are
    # comma-separated, so a literal comma would end the title early.)
    - name: Paths are derived, not named
      if: ${{ !cancelled() }}
      shell: bash
      run: |
        if ! node "$VERIFICATION_GATE_KIT/bin/check-machine-paths.mjs" \
          $(for allow in ${{ inputs.allow-machine-paths }}; do printf -- '--allow %s ' "$allow"; done); then
          echo "::warning title=Paths are derived%2C not named::A tracked file names an absolute machine path. See this step's log; derive the path, or waive it with allow-machine-paths."
        fi

    - name: Backlog describes reality
      if: ${{ !cancelled() && inputs.backlog != '' }}
      shell: bash
      run: |
        if ! node "$VERIFICATION_GATE_KIT/bin/check-backlog.mjs" --file "${{ inputs.backlog }}"; then
          echo "::warning title=Backlog describes reality::The backlog has an entry that is malformed, stale or contradicts the repository. See this step's log."
        fi

    # A fully-skipped suite exits 0, so only a count can tell a green job that
    # ran everything from a green job that ran nothing. Enforced: this is the
    # one gate step that reads the consumer's own tests, which the pull request
    # under review can break.
    - name: Assert the tests actually ran
      if: ${{ !cancelled() && inputs.test-report != '' }}
      shell: bash
      run: |
        node "$VERIFICATION_GATE_KIT/bin/assert-tests-executed.mjs" \
          --report "${{ inputs.test-report }}" \
          --min "${{ inputs.min-tests }}" \
          --label "${{ github.job }}"
