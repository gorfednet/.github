name: verification-gate
description: >-
  Run the verification kit's checks against the calling repository. Projects
  inherit this by upgrading the `uses:` line on their existing pr-check
  workflow; nothing needs adding to the project's own workflow file.

inputs:
  kit:
    description: Path to the vendored verification kit.
    required: false
    default: verification-kit
  backlog:
    description: Path to the project's backlog. Empty skips the backlog check.
    required: false
    default: docs/backlog.json
  test-report:
    description: >-
      Playwright or Vitest JSON report to assert an executed count against.
      Empty skips the assertion, which is only right for a project with no
      tests — a Tier 1 project.
    required: false
    default: ""
  min-tests:
    description: Executed-test floor. Set it to what the job runs today.
    required: false
    default: "1"
  rule-sources:
    description: Space-separated roots to scan for rule citations.
    required: false
    default: "."
  source-dirs:
    description: >-
      Space-separated directories that look generated but hold hand-written
      code in this repository. `build/` is output nearly everywhere and is
      where gorfed.net keeps its Python build scripts. Each one is printed on
      every run, so the exception stays visible.
    required: false
    default: ""
  site-url:
    description: >-
      Production base URL, no trailing slash. Required by the metadata and
      og:image checks, which have to know what "on this site" means before they
      can tell an absolute local URL from a third-party hotlink. Empty skips
      both, which is right only for a project that ships no HTML.
    required: false
    default: ""
  metadata-pages:
    description: >-
      Space-separated HTML files to check, one per route the site actually
      serves — not just the homepage.

      ssatcy.com is why this is a list. It builds one shell for seven routes, so
      six of its pages emitted the homepage's canonical and could not rank,
      while every homepage-level check in the fleet passed. A representative
      page is not a sample of a per-page property; it is the page that works.
    required: false
    default: ""
  publish-root:
    description: >-
      Directory the site's URL paths resolve against on disk, so an og:image URL
      can be turned back into bytes to open. Usually `dist` or `public`.
    required: false
    default: ""
  og-max-bytes:
    description: >-
      Ceiling for the social card image. denseware.com pointed og:image at a
      3840x4557 background weighing 2.1 MB; some scrapers give up first.
    required: false
    default: "300000"
  require-jsonld:
    description: >-
      When "true", every checked page must carry a JSON-LD block. Off by
      default because a Tier 1 holding page has nothing to describe.
    required: false
    default: "false"
  error-page-root:
    description: >-
      Directory that should contain 404.html and 500.html. Empty skips the
      check. This is only the repository half — the server half is the live
      probe in production-healthcheck, because a 404.html nginx was never told
      to serve is exactly as useful as no file (V66).
    required: false
    default: ""
  error-page-markers:
    description: >-
      Space-separated strings from this site's own design that must appear in
      each error page. Without one, "the file exists" is the whole assertion,
      and a placeholder added to turn a check green satisfies it.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # Every step below carries `if: ${{ !cancelled() }}`.
    #
    # GitHub defaults a step to `success()`, so one failure switches off every
    # check after it — and on the run that taught us this, the thing that
    # failed was an artifact upload returning 403 for reasons unrelated to the
    # tests, which skipped the assertion whose whole purpose was proving the
    # job was not inert. A verification step ordered behind something that can
    # fail for an unrelated reason is not a gate. See rule V18.

    - name: Verification kit is present
      if: ${{ !cancelled() }}
      shell: bash
      run: |
        set -euo pipefail
        if [ ! -d "${{ inputs.kit }}" ]; then
          echo "::error::No verification kit at ${{ inputs.kit }}."
          echo "Install it: https://github.com/gorfednet/.github/tree/main/templates/verification-kit"
          exit 1
        fi
        echo "kit: $(find '${{ inputs.kit }}' -type f | wc -l | tr -d ' ') file(s)"

    # Fifteen copies of the same script drift apart one fix at a time, and
    # every one of them keeps printing ticks. This is the only thing looking.
    - name: Kit is current and unmodified
      if: ${{ !cancelled() }}
      shell: bash
      run: node "${{ inputs.kit }}/bin/check-kit-drift.mjs" --kit "${{ inputs.kit }}"

    # The kit ships its own tests and, until this step, no consuming project
    # ever ran them — seventy-six assertions vendored into a repository as
    # decoration. They also answer a question the drift check cannot: whether
    # the kit works *here*, on this runner, in a repository that may have no
    # package.json and no npm at all. The floor is what separates that from a
    # glob quietly matching nothing.
    - name: The kit works in this repository
      if: ${{ !cancelled() }}
      shell: bash
      run: |
        set -euo pipefail
        # Two separate questions, and piping into `grep -c` answers only the
        # second. `node --test | grep` reports grep's status, so a suite where
        # everything failed still exits 0 as long as enough `ok` lines came
        # out of it — and `|| true` on top would swallow even a crash. Run it
        # once to a file, check that it passed, then count what it ran.
        report=$(mktemp)
        status=0
        node --test --test-reporter=tap "${{ inputs.kit }}/test/"*.test.mjs \
          | tee "$report" || status=$?
        if [ "$status" -ne 0 ]; then
          echo "::error::The vendored kit's own tests fail in this repository." \
               "The checks below are running on a kit that does not work here."
          exit 1
        fi
        count=$(grep -c '^ *ok ' "$report" || true)
        echo "kit self-tests executed $count assertion(s)"
        # Raised from 40 to 250 in the change that added check-page-metadata,
        # check-og-image and check-error-pages with 43 tests between them.
        # Measured on that commit: 266 `ok` lines. The floor is not the count —
        # it is far enough below it to tolerate a skip and far enough above the
        # old value that dropping one of the three new suites cannot pass.
        # A floor that stays put while the suite grows stops being a floor.
        if [ "$count" -lt 250 ]; then
          echo "::error::The kit's own suite executed $count tests, expected at least 250." \
               "A glob that matches nothing exits 0 having proven nothing."
          exit 1
        fi

    - name: Rule citations resolve
      if: ${{ !cancelled() }}
      shell: bash
      run: |
        node "${{ inputs.kit }}/bin/check-rule-citations.mjs" \
          $(for root in ${{ inputs.rule-sources }}; do printf -- '--source %s ' "$root"; done)

    - name: No generated files tracked in git
      if: ${{ !cancelled() }}
      shell: bash
      run: |
        node "${{ inputs.kit }}/bin/check-tracked-artifacts.mjs" \
          $(for dir in ${{ inputs.source-dirs }}; do printf -- '--source %s ' "$dir"; done)

    # Both of these need --site-url and a page list. A caller that supplies one
    # and not the other has half-wired the gate, which is worse than not wiring
    # it: the run goes green having skipped the check silently. So the mismatch
    # is a failure rather than a skip.
    - name: Metadata and social-card inputs agree
      if: ${{ !cancelled() }}
      shell: bash
      run: |
        set -euo pipefail
        url="${{ inputs.site-url }}"
        pages="${{ inputs.metadata-pages }}"
        root="${{ inputs.publish-root }}"
        if [ -n "$pages" ] && [ -z "$url" ]; then
          echo "::error::metadata-pages is set but site-url is not, so the" \
               "metadata and og:image checks were skipped. Set site-url."
          exit 1
        fi
        if [ -n "$url" ] && [ -z "$pages" ]; then
          echo "::error::site-url is set but metadata-pages is empty, so the" \
               "metadata check has nothing to read and would pass over zero pages."
          exit 1
        fi
        if [ -n "$pages" ] && [ -z "$root" ]; then
          echo "::error::metadata-pages is set but publish-root is not, so no" \
               "og:image could be resolved to bytes. Set publish-root."
          exit 1
        fi

    # `!cancelled()` on every check above is deliberate (V18): an earlier failure
    # must not be able to switch the gate off. The cost is that when the failure
    # was early enough to skip Build, the gate runs against a publish set that
    # was never produced — and every page-shaped check then reports its own file
    # as missing. ssatcy.com's run showed eighteen ENOENTs from three checkers,
    # all of them true and none of them the cause, while the one real failure sat
    # a screen and a half above them.
    #
    # So the gate says the one thing those eighteen lines could not: the
    # directory is not there. It does not turn the checks off, because a
    # genuinely missing publish set is still a failure — it names it once,
    # accurately, and stops before the noise.
    - name: The publish set the gate was asked to read exists
      if: ${{ !cancelled() && (inputs.publish-root != '' || inputs.error-page-root != '') }}
      shell: bash
      run: |
        set -euo pipefail
        for root in "${{ inputs.publish-root }}" "${{ inputs.error-page-root }}"; do
          [ -n "$root" ] || continue
          if [ ! -d "$root" ]; then
            echo "::error::The gate was asked to read \"$root\" and there is no such" \
                 "directory. Every check below it will report its own file missing," \
                 "which is true and is not the cause. Look for the first failed or" \
                 "skipped step in this job: if Build did not run, that is why."
            exit 1
          fi
          if [ -z "$(find "$root" -type f -print -quit)" ]; then
            echo "::error::The gate was asked to read \"$root\" and it contains no" \
                 "files. A build that produced an empty directory fails here rather" \
                 "than one check at a time."
            exit 1
          fi
        done

    - name: Page metadata is per-page and correct
      if: ${{ !cancelled() && inputs.metadata-pages != '' }}
      shell: bash
      run: |
        set -euo pipefail
        node "${{ inputs.kit }}/bin/check-page-metadata.mjs" \
          --site-url "${{ inputs.site-url }}" \
          ${{ inputs.require-jsonld == 'true' && '--require-jsonld' || '' }} \
          $(for page in ${{ inputs.metadata-pages }}; do printf -- '--page %s ' "$page"; done)

    - name: The social card is the image it says it is
      if: ${{ !cancelled() && inputs.metadata-pages != '' }}
      shell: bash
      run: |
        set -euo pipefail
        node "${{ inputs.kit }}/bin/check-og-image.mjs" \
          --site-url "${{ inputs.site-url }}" \
          --root "${{ inputs.publish-root }}" \
          --max-bytes "${{ inputs.og-max-bytes }}" \
          $(for page in ${{ inputs.metadata-pages }}; do printf -- '--page %s ' "$page"; done)

    - name: Error pages ship with the site
      if: ${{ !cancelled() && inputs.error-page-root != '' }}
      shell: bash
      run: |
        set -euo pipefail
        node "${{ inputs.kit }}/bin/check-error-pages.mjs" \
          --root "${{ inputs.error-page-root }}" \
          $(for marker in ${{ inputs.error-page-markers }}; do printf -- '--expect-text %s ' "$marker"; done)

    - name: Backlog describes reality
      if: ${{ !cancelled() && inputs.backlog != '' }}
      shell: bash
      run: node "${{ inputs.kit }}/bin/check-backlog.mjs" --file "${{ inputs.backlog }}"

    # A fully-skipped suite exits 0, so only a count can tell a green job that
    # ran everything from a green job that ran nothing.
    - name: Assert the tests actually ran
      if: ${{ !cancelled() && inputs.test-report != '' }}
      shell: bash
      run: |
        node "${{ inputs.kit }}/bin/assert-tests-executed.mjs" \
          --report "${{ inputs.test-report }}" \
          --min "${{ inputs.min-tests }}" \
          --label "${{ github.job }}"
