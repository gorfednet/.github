name: no-smb guard
description: Fail if legacy SMB/CIFS share-mount deploy references reappear in tracked sources
runs:
  using: composite
  steps:
    - name: Checkout gorfednet/.github scripts
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        repository: gorfednet/.github
        path: .gorfednet-github
        sparse-checkout: |
          scripts
        sparse-checkout-cone-mode: false
    - name: Install ripgrep
      shell: bash
      run: |
        set -euo pipefail
        if ! command -v rg >/dev/null 2>&1; then
          sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep
        fi
    - name: Run no-smb guard
      shell: bash
      run: bash .gorfednet-github/scripts/no-smb-guard.sh "${{ github.workspace }}"
