name: no-smb guard
description: Fail if legacy SMB/CIFS share-mount deploy references reappear in tracked sources
runs:
  using: composite
  steps:
    - name: Checkout gorfednet/.github scripts
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        repository: gorfednet/.github
        path: .gorfednet-github
        sparse-checkout: |
          scripts
        sparse-checkout-cone-mode: false
    # No ripgrep install, on any runner (11 November 2026). A hosted runner's
    # `apt-get install ripgrep` could not resolve security.ubuntu.com and took
    # heuristics #85 `check` red for a reason the pull request cannot change. The
    # guard uses rg when the runner has one and otherwise falls back to grep with
    # the same verdict; test/noSmbGuard.test.mjs runs every case under both.
    - name: Run no-smb guard
      shell: bash
      run: bash .gorfednet-github/scripts/no-smb-guard.sh "${{ github.workspace }}"
