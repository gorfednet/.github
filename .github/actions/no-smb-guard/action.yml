name: no-smb guard
description: Fail if legacy SMB/CIFS share-mount deploy references reappear in tracked sources
runs:
  using: composite
  steps:
    - name: Checkout gorfednet/.github scripts
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        repository: gorfednet/.github
        path: .gorfednet-github
        sparse-checkout: |
          scripts
        sparse-checkout-cone-mode: false
    - name: Install ripgrep when it can be
      shell: bash
      run: |
        set -euo pipefail
        # The self-hosted pool's containers have no sudo, no apt and no rg. There
        # the guard script falls back to grep with the same verdict, so a missing
        # sudo is not an error here; hosted runners keep installing ripgrep.
        if ! command -v rg >/dev/null 2>&1 && command -v sudo >/dev/null 2>&1 && sudo -n true >/dev/null 2>&1; then
          # `apt-get update` exits non-zero if *any* configured repository
          # fails, and the runner image ships a Google Chrome source this build
          # has no use for. A transient hash mismatch there took the static-site
          # check red on two pull requests at once, while ripgrep sat in
          # Ubuntu's own universe repo entirely unaffected.
          #
          # The install may fail too. On 11 November 2026 hosted runners could
          # not resolve security.ubuntu.com for over 1.5 hours, and a hard
          # install failure took every `check` job red before any build ran.
          # ripgrep is a speed-up, not the guard: without it the guard script
          # falls back to grep with the same verdict (commit 582d8ac), so a
          # failed install says why and carries on.
          sudo apt-get update -qq || echo "apt-get update reported errors; continuing to install"
          sudo apt-get install -y -qq ripgrep || echo "ripgrep could not be installed; the guard falls back to grep"
        fi
    - name: Run no-smb guard
      shell: bash
      run: bash .gorfednet-github/scripts/no-smb-guard.sh "${{ github.workspace }}"
