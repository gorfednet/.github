server {
    listen 80;
    listen [::]:80;
    server_name spaceman.gorfed.net www.spaceman.gorfed.net;
    root /usr/share/nginx/html/spaceman.gorfed.net;
    index index.html;

    if ($redirect_https) {
        return 308 https://$host$request_uri;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(env|log|sql|md|json|lock|key|pem|config|ini|bak|backup|old|tmp)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    server_tokens off;
}
