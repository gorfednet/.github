# Nginx vhost for 4thcltr.com: the file that serves the site, not a template.
#
# Where it runs: the `nginx` container (nginx:alpine) on dapyllil, which mounts
#   /home/gorf/Docker/nginx/conf.d -> /etc/nginx/conf.d (read-only)
# Port 80 only. TLS terminates at Cloudflare, which reaches this container
# through the tunnel; `$redirect_https` comes from 00-http-redirect-map.conf in
# the same directory. The docroot is the NAS share that `make deploy` rsyncs to.
#
# Installing a change (DEPLOY.md, "The web server"):
#   scp nginx/4thcltr.com.conf dapyllil:/home/gorf/Docker/nginx/conf.d/4thcltr.com.conf
#   ssh dapyllil 'docker exec nginx nginx -t && docker exec nginx nginx -s reload'
# then re-capture it into gorfednet/.github infra/nginx/vhosts/. Editing this
# file changes nothing until it is copied; `npm run headers:live` (and the
# scheduled production-healthcheck) compares what the site serves with it.

server {
    listen 80;
    listen [::]:80;
    server_name 4thcltr.com www.4thcltr.com;
    root /mnt/gorfednas/websites/4thcltr.com;
    index index.html;

    if ($redirect_https) {
        return 308 https://$host$request_uri;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    # Security headers. Every location below that sets its own add_header must
    # also say `add_header_inherit merge;`, or nginx drops all of these from its
    # responses. Before 2026-10-16 none of them reached a visitor: this file
    # declared them for a 443 server that did not exist, and the live vhost had
    # none. scripts/check-live-headers.mjs holds the served values to these.
    #
    # static.cloudflareinsights.com / cloudflareinsights.com: Cloudflare Web
    # Analytics, which Cloudflare injects into every page at the edge.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'; frame-src 'none'; img-src 'self' data:; font-src 'self' data: https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' https://plausible.io https://static.cloudflareinsights.com; connect-src 'self' https://api.web3forms.com https://plausible.io https://open.er-api.com https://assist.gorfed.net https://cloudflareinsights.com; upgrade-insecure-requests;" always;

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot|webp|avif)$ {
        expires 1y;
        add_header_inherit merge;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(env|log|sql|md|json|lock|key|pem|config|ini|bak|backup|old|tmp)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Branded error bodies at the correct status. nginx returns the file with the
    # original code, so an unknown URL is still a hard 404 and never a soft one.
    # Verified before rollout: with the target file absent nginx serves its own
    # 404 rather than entering a redirect cycle, so these were safe to add ahead
    # of the deploys that create the pages.
    error_page 404 /404.html;
    error_page 500 502 503 504 /500.html;

    location / {
        try_files $uri $uri/ =404;
    }

    server_tokens off;
}
